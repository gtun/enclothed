<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>enclothed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
/* Bright by default; the viewer's own Day/Evening choice wins. */
(function(){ let t = null; try { t = localStorage.getItem("enclothed-theme"); } catch (e) {}
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); })();
</script>
<style>
/* A gallery-white floor so each garment reads true; rails of garments, racks of outfits, and detail pages that link the two. */
:root{
  --bg:#f6f6f5; --surface:#ffffff; --ink:#1d1d1c; --muted:#6b6b68; --line:#e3e3e0;
  --photo:#eeeeec; --chip:#f0f0ee; --accent:#1d1d1c; --on-accent:#ffffff;
  --tag:#f4f0e6; --tag-ink:#3a3528; --shade:rgba(0,0,0,.06);
  --good:#2f6b3a; --bad:#a3332b; --hover:#f2f2f0;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1b1b1b; --ink:#ececea; --muted:#9c9c98; --line:#2e2e2d;
  --photo:#232322; --chip:#262625; --accent:#ececea; --on-accent:#121212;
  --tag:#2a2720; --tag-ink:#e6dfc9; --shade:rgba(0,0,0,.4);
  --good:#7fc48c; --bad:#f08c84; --hover:#232322; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{text-decoration:none;margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.logo b{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.logo span{font:400 .8rem var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.seg a,.seg button{font:500 .84rem var(--body);border:0;background:none;color:var(--muted);padding:5px 13px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg svg{width:13px;height:13px}

header.hero{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-top:28px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3rem);line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:65ch}
.stats{display:flex;gap:20px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.stats b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--ink);font-weight:700;line-height:1.1}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .sep{width:1px;height:22px;background:var(--line);margin-inline:4px}
.filters button{font:500 .84rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 14px;cursor:pointer;max-width:30ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.filters button span{opacity:.6;font-variant-numeric:tabular-nums}

section.rail{display:flex;flex-direction:column;gap:12px}
.rail h2{font-family:var(--display);font-weight:500;font-size:1.02rem;margin:0;display:flex;align-items:center;gap:12px;text-transform:uppercase;letter-spacing:.08em}
.rail h2::after{content:"";flex:1;height:1px;background:var(--line)}
.rail h2 span{color:var(--muted);font-family:var(--body);font-size:.8rem;letter-spacing:0}
.rail h2.req{text-transform:none;letter-spacing:0;font-size:1.15rem;font-weight:500}
.rail h2.req q{quotes:"“" "”"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}

/* garment card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.ph{aspect-ratio:3/4;width:100%;max-width:100%;position:relative;background:var(--photo);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .sw{width:44%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line)}
.badge{position:absolute;font:500 .7rem var(--mono);background:var(--surface);color:var(--ink);padding:2px 7px;border-radius:4px;box-shadow:0 1px 2px var(--shade)}
.badge.id{top:8px;left:8px;color:var(--muted)}
.badge.set{top:8px;right:8px;display:inline-flex;gap:5px;align-items:center;max-width:calc(100% - 64px);font-family:var(--body);font-weight:500}
.badge.set b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge svg{flex:none}
.meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.brand{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font-weight:600;line-height:1.25}
.chips{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.chip{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:inline-block;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.scales{display:flex;gap:10px}
.row>span,.scales>span{white-space:nowrap;display:inline-flex;align-items:center}
.pips{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ink)}

/* palette stripe */
.pal{display:flex;height:12px;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pal i{display:block;min-width:8px}
.pal.big{height:30px;border-radius:5px}
.palnames{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 .76rem var(--mono);color:var(--muted)}
.palnames span{display:inline-flex;align-items:center;gap:6px}
.palnames i{width:10px;height:10px;border-radius:2px;border:1px solid var(--line)}

/* outfit card */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:border-color .15s,transform .15s}
.ocard:hover{border-color:var(--ink);transform:translateY(-2px)}
.ocard.disliked{opacity:.6}
.flat{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--line);height:clamp(130px,13vw,160px)}
.flat span{background:var(--photo);overflow:hidden;min-width:0;display:grid;place-items:center}
.flat img{width:100%;height:100%;object-fit:cover;display:block}
.flat .sw{width:40%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line)}
.obody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;min-width:0;flex:1}
.obody h3{font-family:var(--display);font-weight:700;font-size:1.18rem;line-height:1.15;margin:0;text-wrap:balance}
.clamp{margin:0;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ofoot{margin-top:auto;font-size:.74rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ofoot .liked{color:var(--good);font-weight:500}
.ofoot .disliked{color:var(--bad);font-weight:500}

/* detail pages */
.back{display:inline-flex;align-items:center;gap:6px;font:500 .85rem var(--body);color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;align-self:flex-start}
.back:hover{color:var(--ink);border-color:var(--ink)}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:-8px}
.gallery{position:sticky;top:76px;background:var(--photo);border-radius:8px;overflow:hidden;min-width:0}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;margin:0}
.slide img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 170px)}
.gnav{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 12px;font:500 .78rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);border-top:1px solid var(--line)}
.gnav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:32px;height:32px;font-size:1.05rem;cursor:pointer}
.gnav button:disabled{opacity:.35;cursor:default}
.info{display:flex;flex-direction:column;gap:20px;min-width:0}
.info h2{font-family:var(--display);font-size:clamp(1.6rem,3.5vw,2.1rem);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.notes{max-width:65ch;margin:0}
.mine{border-left:2px solid var(--ink);padding-left:10px;font-style:italic;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tags span.tg{font-size:.74rem;background:var(--chip);border-radius:999px;padding:2px 9px}
.label{background:var(--tag);color:var(--tag-ink);font:400 .74rem/1.6 var(--mono);padding:12px 14px;border-radius:3px;border-block:2px dashed var(--line);text-transform:uppercase;overflow-wrap:anywhere;white-space:pre-wrap}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h4{margin:0;font:600 .9rem var(--body);display:flex;align-items:center;gap:8px;justify-content:space-between}
.panel h4 small{font-weight:400;color:var(--muted);font-size:.78rem}
.inset{display:flex;gap:10px;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;gap:5px;width:104px;text-decoration:none;font-size:.76rem;line-height:1.25}
.mini .ph{border-radius:5px;border:1px solid var(--line)}
.mini:hover .ph{border-color:var(--ink)}
.mini em{font-style:normal;color:var(--muted)}
.olist{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;margin:-4px -6px;padding:0 6px;overscroll-behavior:contain}
.orow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 4px;text-decoration:none;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.orow:hover b{text-decoration:underline}
.orow .vpal{display:flex;flex-direction:column;width:10px;align-self:stretch;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.vpal i{flex:1}
.orow b{font-weight:600;display:block}
.orow span{display:block;font-size:.8rem;color:var(--muted)}
.orow time{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);font-size:.86rem;margin:0}
.state{padding:60px 0;text-align:center;color:var(--muted)}
.state h1{color:var(--ink);margin-bottom:10px}
.state code{font-family:var(--mono);background:var(--chip);padding:1px 6px;border-radius:4px}

/* editable details */
.edit-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.edit-head h3{margin:0;font:600 .9rem var(--body)}
.edit-head small{color:var(--muted);font-size:.76rem}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;font-size:.88rem;margin:0;align-items:start}
.kv dt{color:var(--muted);padding:6px 0}
.kv dd{margin:0;min-width:0}
.ev{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;text-align:left;border:1px solid transparent;background:none;border-radius:6px;padding:5px 8px;margin-left:-8px;cursor:pointer;flex-wrap:wrap}
.ev:hover{background:var(--hover);border-color:var(--line)}
.ev .pen{margin-left:auto;opacity:0;color:var(--muted);flex:none}
.ev:hover .pen,.ev:focus-visible .pen{opacity:1}
.ev .none{color:var(--muted)}
.ev.block{display:block;padding:8px 10px;margin-left:-10px;width:calc(100% + 20px)}
.ev.block .pen{position:absolute;right:10px;top:8px}
.ev.block{position:relative}
.cchip{display:inline-flex;align-items:center;gap:6px}
.addnote{color:var(--muted);font-size:.86rem}

/* combobox */
.cb{position:relative;width:100%}
.cb input,.txt,.num,textarea.txt{width:100%;font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--ink);border-radius:6px;padding:6px 9px}
.cb input{padding-right:30px}
.cb .caret{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.cb ul{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px var(--shade);max-height:260px;overflow-y:auto}
.cb li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:.88rem}
.cb li[aria-selected="true"]{background:var(--chip)}
.cb li.cur::after{content:"current";margin-left:auto;font:400 .7rem var(--mono);color:var(--muted)}
.cb li.free{color:var(--muted)}
.cb li.free b{color:var(--ink);font-weight:500}
.cb.inline ul{position:static;margin-top:4px;box-shadow:none;max-height:200px}
.cb .nomatch{padding:8px;color:var(--muted);font-size:.84rem}
.cb.invalid input{border-color:var(--bad)}
.hintline{font-size:.74rem;color:var(--muted);margin-top:4px}
.hintline.err{color:var(--bad)}
.multi{display:flex;flex-direction:column;gap:8px;width:100%}
.multi .have{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:3px 4px 3px 10px;font-size:.82rem}
.pill button{border:0;background:none;cursor:pointer;color:var(--muted);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;line-height:1}
.pill button:hover{background:var(--line);color:var(--ink)}
.btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font:500 .84rem var(--body)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);border-color:var(--line)}
.done-btn{align-self:flex-start}

/* materials editor */
.mats{display:flex;flex-direction:column;gap:12px;width:100%}
.mpart{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.mpart .top{display:flex;gap:8px;align-items:center}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:6px;align-items:center}
.num{text-align:right}
.pct{position:relative}
.pct::after{content:"%";position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem}
.frow .x,.mpart .x{border:0;background:none;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:50%;font-size:1rem;margin-left:12px}
.frow .x:hover,.mpart .x:hover{background:var(--chip);color:var(--ink)}
.msum{font:400 .74rem var(--mono);color:var(--muted)}
.msum.off{color:var(--bad)}

/* outfit page */
.ohead{display:flex;flex-direction:column;gap:14px;padding-top:22px;max-width:820px}
.req{color:var(--muted);margin:0}
.req q{color:var(--ink);quotes:"“" "”"}
.lede{font-size:1.06rem;max-width:65ch;margin:0}
.missing{background:var(--tag);color:var(--tag-ink);border-radius:6px;padding:12px 14px;max-width:65ch;font-size:.9rem}
.missing b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.piece{display:flex;flex-direction:column;gap:9px;text-decoration:none;min-width:0}
.piece .ph{border-radius:8px;border:1px solid var(--line)}
.piece:hover .ph{border-color:var(--ink)}
.piece .nm{font-weight:600;line-height:1.25}
.piece p{margin:0;font-size:.9rem}
.anchor{display:inline-block;font:500 .66rem var(--body);text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--ink);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px;color:var(--ink)}
.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.pager a{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;text-decoration:none;color:var(--ink)}
.pager a[aria-disabled="true"]{opacity:.35;pointer-events:none}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rate .seg button{color:var(--ink)}
.rate .seg button[data-rate="true"][aria-pressed="true"]{background:var(--good);color:#fff}
.rate .seg button[data-rate="false"][aria-pressed="true"]{background:var(--bad);color:#fff}
.rate small{color:var(--muted);font-size:.78rem}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--accent);color:var(--on-accent);
  padding:9px 16px;border-radius:999px;font:500 .86rem var(--body);box-shadow:0 6px 20px var(--shade);max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--bad);color:#fff}

@media (max-width:780px){
  .detail{grid-template-columns:minmax(0,1fr)}
  .gallery{position:static}
  .slide img{max-height:62vh}
  .stats{gap:14px}
}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .seg a,.seg button{padding:5px 10px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{padding:8px 0 0}
}
@media (prefers-reduced-motion:reduce){.card,.ocard,.toast{transition:none}.card:hover,.ocard:hover{transform:none}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="logo" href="#wardrobe"><b>enclothed</b><span id="who"></span></a>
  <nav class="seg" aria-label="Sections"><a href="#wardrobe" id="nav-wardrobe">Wardrobe</a><a href="#outfits" id="nav-outfits">Outfits</a></nav>
  <div class="seg" role="group" aria-label="Backdrop">
    <button type="button" data-t="light" title="Bright, neutral backdrop"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></g></svg>Day</button>
    <button type="button" data-t="dark" title="Dark backdrop"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg>Evening</button>
  </div>
</div></div>

<div class="wrap" id="app"><div class="state"><p>Loading your wardrobe…</p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= state ================= */
let G = [], O = [], SETS = [], OPT = null;
let byId = {}, outById = {}, setById = {}, outfitsOf = {}, REQUESTS = [], HEX = {};
const RAIL_ORDER = ["outerwear", "top", "bottom", "one-piece", "shoes", "accessory"];

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let showDisliked = store.get("enclothed-show-disliked", false);

/* ================= helpers ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hex = c => HEX[c] || "#999999";
const pips = (n, max) => `<span class="pips">${Array.from({length:max},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join("")}</span>`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const when = ts => new Date(ts).toLocaleDateString(undefined, {month:"short", day:"numeric"});
const whenLong = ts => new Date(ts).toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
const catRank = g => { const i = RAIL_ORDER.indexOf(g?.category); return i < 0 ? 99 : i; };
const setName = s => s ? (s.name || `Set #${s.id}`) : "";
const title = g => [g.brand, g.subcategory].filter(Boolean).join(" ");
const levelLabel = (list, v) => (list.find(l => l.value === v) || {}).label || "";
const choiceLabel = (list, v) => (list.find(l => l.value === v) || {}).label || v;
const unique = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b));
const SET_ICON = `<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="1.5" y="4.5" width="8" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="6.5" y="1.5" width="8" height="10" rx="1.5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/></svg>`;
const PEN = `<svg class="pen" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.3 2.3a1.6 1.6 0 0 1 2.3 2.3L5.4 12.8l-3 .8.8-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const THUMB_UP = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 7v7H2.5V7zM5 7l3-5c1.2 0 1.8.8 1.6 2L9.2 6.5h3.6c.9 0 1.5.8 1.3 1.6l-1.2 4.9c-.2.6-.7 1-1.3 1H5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const THUMB_DOWN = `<svg viewBox="0 0 16 16" aria-hidden="true" style="transform:rotate(180deg)"><path d="M5 7v7H2.5V7zM5 7l3-5c1.2 0 1.8.8 1.6 2L9.2 6.5h3.6c.9 0 1.5.8 1.3 1.6l-1.2 4.9c-.2.6-.7 1-1.3 1H5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;

const photoName = url => decodeURIComponent(url.split("/").pop()).replace(/\.\w+$/, "");
const mainPhoto = g => g.photos.length ? g.photos[0].url : null;

let toastTimer = null;
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.toggle("err", !!isErr); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), isErr ? 6000 : 1800);
}

/* ================= API ================= */
async function api(path, options = {}){
  const init = {headers: {"Accept": "application/json"}, ...options};
  if (options.body !== undefined){ init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(options.body); }
  let res;
  try { res = await fetch(path, init); }
  catch (e) { throw new Error("Couldn't reach the server. Is it still running?"); }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(errorText(data, res.status));
  return data;
}
function errorText(data, status){
  const d = data && data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d) && d.length) return d.map(e => {
    const field = (e.loc || []).filter(x => x !== "body" && typeof x === "string").join(" › ");
    return (field ? field + ": " : "") + String(e.msg || "").replace(/^Value error, /, "");
  }).join("; ");
  return `Request failed (${status})`;
}

/* ================= indexes ================= */
function adoptOutfit(o){
  o.pieces = o.garments.map(x => ({id: x.garment.id, advice: x.styling_advice, anchor: x.is_anchor}));
  return o;
}
function reindex(){
  byId = Object.fromEntries(G.map(g => [g.id, g]));
  outById = Object.fromEntries(O.map(o => [o.id, o]));
  setById = Object.fromEntries(SETS.map(s => [s.id, s]));
  O.forEach(o => o.pieces.sort((a, b) => catRank(byId[a.id]) - catRank(byId[b.id])));
  outfitsOf = {};
  O.forEach(o => o.pieces.forEach(p => (outfitsOf[p.id] ||= []).push({o, advice: p.advice, anchor: p.anchor})));
  REQUESTS = [];
  O.forEach(o => { let r = REQUESTS.find(x => x.text === o.prompt_message); if (!r) REQUESTS.push(r = {text: o.prompt_message, items: []}); r.items.push(o); });
  REQUESTS.forEach((r, i) => r.key = "r" + i);
}
const reqOf = o => REQUESTS.find(r => r.text === o.prompt_message);
const visible = o => showDisliked || o.liked !== false;

/* ================= shared bits ================= */
function ph(g, src, eager){
  return src ? `<img src="${esc(encodeURI(src))}" alt="" ${eager ? "" : 'loading="lazy"'} decoding="async">`
             : `<span class="sw" style="background:${hex(g.primary_color)}"></span>`;
}
function palette(o){
  const seg = [];
  o.pieces.forEach(p => { const c = byId[p.id]?.primary_color; const last = seg[seg.length-1]; if (last && last.c === c) last.n++; else seg.push({c, n:1}); });
  return seg;
}
const palBar = (o, cls="") => `<div class="pal ${cls}" role="img" aria-label="Palette: ${esc(palette(o).map(s=>s.c).join(", "))}">${palette(o).map(s => `<i style="flex:${s.n};background:${hex(s.c)}" title="${esc(s.c)}"></i>`).join("")}</div>`;
const vPal = o => `<span class="vpal" aria-hidden="true">${palette(o).map(s => `<i style="flex:${s.n};background:${hex(s.c)}"></i>`).join("")}</span>`;
const likeTag = o => o.liked === true ? `<span class="liked">liked</span>` : o.liked === false ? `<span class="disliked">disliked</span>` : "";

/* ================= wardrobe ================= */
let cat = "all", scope = "any";
function gCard(g){
  const s = setById[g.set_id];
  const chips = [g.primary_color, ...g.secondary_colors, ...g.accent_colors].filter(Boolean)
    .map(c => `<span class="chip" title="${esc(c)}" style="background:${hex(c)}"></span>`).join("");
  const n = (outfitsOf[g.id] || []).length;
  return `<a class="card" href="#garment-${g.id}" aria-label="${esc(title(g))}, ${esc(g.primary_color)}">
    <div class="ph">${ph(g, mainPhoto(g))}<span class="badge id">#${g.id}</span>
      ${s ? `<span class="badge set" title="Part of a set: ${esc(setName(s))}">${SET_ICON}<b>${esc(setName(s))}</b></span>` : ""}</div>
    <div class="meta">
      <span class="brand">${esc(g.brand || "unknown brand")}</span>
      <span class="sc">${esc(g.subcategory)}</span>
      <span class="chips">${chips}</span>
      <span class="row"><span class="scales"><span>F${pips(g.formality||0,4)}</span><span>W${pips(g.warmth||0,5)}</span></span><span>${n ? plural(n,"outfit") : "no outfits"}</span></span>
    </div></a>`;
}
function wardrobe(){
  if (!G.length) return `<div class="state"><h1>Your wardrobe is empty</h1><p>Add garments from the command line with <code>enclothed add</code>, then refresh this page.</p></div>`;
  const inScope = g => scope === "any" || (scope === "sets" && g.set_id) || (scope === "unstyled" && !outfitsOf[g.id]);
  const pool = G.filter(inScope);
  const cats = RAIL_ORDER.filter(c => G.some(g => g.category === c));
  const brands = new Set(G.map(g => g.brand).filter(Boolean)).size;
  const nUnstyled = G.filter(g => !outfitsOf[g.id]).length, nSet = G.filter(g => g.set_id).length;
  const btn = (k, v, label, n) => `<button type="button" data-${k}="${esc(v)}" aria-pressed="${(k==='cat'?cat:scope)===v}">${esc(label)} <span>${n}</span></button>`;
  const rails = cats.filter(c => cat === "all" || c === cat).map(c => {
    const items = pool.filter(g => g.category === c);
    return items.length ? `<section class="rail"><h2>${esc(c)} <span>${items.length}</span></h2><div class="grid">${items.map(gCard).join("")}</div></section>` : "";
  }).join("") || `<p class="empty">Nothing matches these filters.</p>`;
  return `<header class="hero"><div><h1>The wardrobe</h1><p class="sub">Every garment, as tagged from its photos. Open one to see its set, every outfit it has been styled into, and to correct any tag.</p></div>
    <div class="stats"><div><b>${G.length}</b>garments</div><div><b>${brands}</b>brands</div><div><b>${SETS.length}</b>sets</div><div><b>${O.length}</b>outfits</div></div></header>
    <div class="filters" role="toolbar" aria-label="Filter garments">
      ${btn("cat","all","All",pool.length)}${cats.map(c => btn("cat", c, c, pool.filter(g => g.category === c).length)).join("")}
      <span class="sep" aria-hidden="true"></span>
      ${btn("scope","any","Any",G.length)}${btn("scope","sets","In a set",nSet)}${btn("scope","unstyled","Not in any outfit",nUnstyled)}
    </div>
    <main style="display:flex;flex-direction:column;gap:30px">${rails}</main>`;
}

/* ================= outfits ================= */
let req = "all";
function oCard(o){
  const pcs = o.pieces.map(p => byId[p.id]).filter(Boolean);
  return `<a class="ocard${o.liked === false ? " disliked" : ""}" href="#outfit-${o.id}">
    <div class="flat" aria-hidden="true">${pcs.map(g => `<span>${ph(g, mainPhoto(g))}</span>`).join("")}</div>
    ${palBar(o)}
    <div class="obody"><h3>${esc(o.aesthetic)}</h3><p class="clamp">${esc(o.explanation)}</p>
      <div class="ofoot"><span>${when(o.timestamp)}</span><span>${plural(pcs.length,"piece")}</span>${o.missing ? "<span>needs extras</span>" : ""}${likeTag(o)}</div></div></a>`;
}
function outfits(){
  if (!O.length) return `<header class="hero"><div><h1>Outfits</h1></div></header><div class="state"><p>No outfits yet. Ask for some with <code>enclothed outfit</code>, then refresh this page.</p></div>`;
  const groups = [...REQUESTS].reverse().map(r => ({...r, shown: r.items.filter(visible)})).filter(r => r.shown.length);
  const nDisliked = O.filter(o => o.liked === false).length;
  if (req !== "all" && !groups.some(r => r.key === req)) req = "all";
  const shownTotal = groups.reduce((n, r) => n + r.shown.length, 0);
  const btn = (k, label, n, full) => `<button type="button" data-req="${k}" aria-pressed="${req===k}" title="${esc(full||label)}">${esc(label)} <span>${n}</span></button>`;
  const toggle = nDisliked ? `<span class="sep" aria-hidden="true"></span><button type="button" data-toggle-disliked aria-pressed="${showDisliked}">${showDisliked ? "Showing" : "Show"} disliked <span>${nDisliked}</span></button>` : "";
  const shown = groups.filter(r => req === "all" || r.key === req);
  return `<header class="hero"><div><h1>Outfits</h1><p class="sub">Every outfit suggested so far, grouped by what you asked for. The stripe is each piece's main color, outer layer down to shoes.</p></div>
    <div class="stats"><div><b>${O.length}</b>outfits</div><div><b>${REQUESTS.length}</b>requests</div><div><b>${O.filter(o => o.liked).length}</b>liked</div></div></header>
    <div class="filters" role="toolbar" aria-label="Filter by request">${btn("all","All requests",shownTotal)}${groups.map(r => btn(r.key, r.text, r.shown.length, r.text)).join("")}${toggle}</div>
    <main style="display:flex;flex-direction:column;gap:34px">${shown.length ? shown.map(r => `<section class="rail"><h2 class="req"><q>${esc(r.text)}</q> <span>${plural(r.shown.length,"option")}</span></h2>
      <div class="ogrid">${r.shown.map(oCard).join("")}</div></section>`).join("") : `<p class="empty">Every outfit here is disliked. Use “Show disliked” to see them.</p>`}</main>`;
}

/* ================= outfit page ================= */
function outfitPage(o){
  const r = reqOf(o), i = r.items.indexOf(o);
  const prev = r.items[i-1], next = r.items[i+1];
  const names = palette(o).map(s => `<span><i style="background:${hex(s.c)}"></i>${esc(s.c)}</span>`).join("");
  const rateBtn = (v, icon, label) => `<button type="button" data-rate="${v}" aria-pressed="${o.liked === v}">${icon}${label}</button>`;
  return `<div class="ohead">
      <button type="button" class="back" data-back="outfits">← Outfits</button>
      <p class="req">Asked for <q>${esc(o.prompt_message)}</q> · ${esc(whenLong(o.timestamp))}</p>
      <h1>${esc(o.aesthetic)}</h1>
      ${palBar(o, "big")}<div class="palnames">${names}</div>
      <div class="rate"><div class="seg" role="group" aria-label="Rate this outfit">${rateBtn(true, THUMB_UP, "Like")}${rateBtn(false, THUMB_DOWN, "Dislike")}</div>
        <small>${o.liked === null || o.liked === undefined ? "Not rated" : "Click again to clear"}</small></div>
      <p class="lede">${esc(o.explanation)}</p>
      ${o.missing ? `<div class="missing"><b>To finish the look</b>${esc(o.missing)}</div>` : ""}
      ${r.items.length > 1 ? `<nav class="pager" aria-label="Other options for this request">
        <a href="${prev ? "#outfit-"+prev.id : "#"}" aria-disabled="${!prev}">‹ Prev</a>
        <span>Option ${i+1} of ${r.items.length} for this request</span>
        <a href="${next ? "#outfit-"+next.id : "#"}" aria-disabled="${!next}">Next ›</a></nav>` : ""}
    </div>
    <section class="pieces" aria-label="Pieces">${o.pieces.map(p => { const g = byId[p.id]; if (!g) return ""; return `
      <a class="piece" href="#garment-${g.id}">
        <div class="ph">${ph(g, mainPhoto(g))}<span class="badge id">#${g.id}</span>${g.set_id ? `<span class="badge set" title="Part of a set">${SET_ICON}<b>${esc(setName(setById[g.set_id]))}</b></span>` : ""}</div>
        <span class="eyebrow">${esc(g.category)}${p.anchor ? `<span class="anchor" title="You asked for the outfit to be built around this piece">anchor</span>` : ""}</span>
        <span class="nm">${esc(title(g))}</span>
        ${p.advice ? `<p>${esc(p.advice)}</p>` : `<p class="empty">No specific advice for this piece.</p>`}
      </a>`; }).join("")}</section>`;
}

/* ================= garment page ================= */
/* Editable fields: how each one shows, and which editor it opens. */
const FIELDS = [
  {key:"category", label:"Category", kind:"category"},
  {key:"subcategory", label:"Subcategory", kind:"subcategory"},
  {key:"brand", label:"Brand", kind:"text", suggest:() => unique(G.map(g => g.brand))},
  {key:"primary_color", label:"Primary color", kind:"color"},
  {key:"secondary_colors", label:"Secondary", kind:"colors"},
  {key:"accent_colors", label:"Accent", kind:"colors"},
  {key:"formality", label:"Formality", kind:"level", list:() => OPT.formality},
  {key:"warmth", label:"Warmth", kind:"level", list:() => OPT.warmth},
  {key:"fit", label:"Fit", kind:"choice", list:() => OPT.fits},
  {key:"sheen", label:"Sheen", kind:"choice", list:() => OPT.sheens},
  {key:"pattern", label:"Pattern", kind:"text", suggest:() => unique(G.map(g => g.pattern))},
  {key:"materials", label:"Materials", kind:"materials"},
  {key:"country_of_origin", label:"Made in", kind:"text", suggest:() => unique(G.map(g => g.country_of_origin))},
];
const colorChip = c => `<span class="cchip"><span class="chip" style="background:${hex(c)}"></span>${esc(c)}</span>`;
function displayValue(g, f){
  const v = g[f.key];
  const none = `<span class="none">—</span>`;
  switch (f.kind){
    case "color": return colorChip(v);
    case "colors": return v.length ? v.map(colorChip).join("") : none;
    case "level": return v ? `${v} · ${esc(levelLabel(f.list(), v))}` : none;
    case "choice": return v ? esc(choiceLabel(f.list(), v)) : none;
    case "materials": return v.length ? v.map(m => `<span style="display:block">${m.part ? `<span class="none">${esc(m.part)}:</span> ` : ""}${m.fibers.map(x => `${esc(x.fiber)} ${x.percent}%`).join(", ")}</span>`).join("") : none;
    default: return v ? esc(v) : none;
  }
}
const evButton = (field, label, inner, cls="") => `<button type="button" class="ev ${cls}" data-edit="${field}" aria-label="Edit ${esc(label)}">${inner}${PEN}</button>`;

function garmentPage(g){
  const s = setById[g.set_id];
  let setPanel = "";
  if (s){
    const others = G.filter(x => x.set_id === s.id && x.id !== g.id);
    const ids = G.filter(x => x.set_id === s.id).map(x => x.id);
    const together = O.filter(o => ids.every(id => o.pieces.some(p => p.id === id))).length;
    setPanel = `<div class="panel"><h4><span style="display:inline-flex;gap:7px;align-items:center">${SET_ICON} Part of a set: ${esc(setName(s))}</span><small>worn together in ${plural(together,"outfit")}</small></h4>
      <div class="inset">${others.map(x => `<a class="mini" href="#garment-${x.id}"><div class="ph">${ph(x, mainPhoto(x))}</div><span>${esc(x.subcategory)}</span><em>#${x.id}</em></a>`).join("")}</div></div>`;
  }
  const allUses = (outfitsOf[g.id] || []).slice().sort((a, b) => b.o.timestamp.localeCompare(a.o.timestamp));
  const uses = allUses.filter(u => visible(u.o));
  const hidden = allUses.length - uses.length;
  const outPanel = `<div class="panel"><h4>In outfits <small>${uses.length ? plural(uses.length,"outfit") : ""}${hidden ? ` · ${hidden} disliked hidden` : ""}</small></h4>
    ${uses.length ? `<div class="olist" tabindex="0" aria-label="Outfits with this garment">${uses.map(u => `
      <a class="orow" href="#outfit-${u.o.id}">${vPal(u.o)}<span><b>${esc(u.o.aesthetic)}</b><span>${u.advice ? esc(u.advice) : esc(u.o.prompt_message)}</span></span><time>${when(u.o.timestamp)}</time></a>`).join("")}</div>`
      : `<p class="empty">${hidden ? "Only in disliked outfits." : "Not in any outfit yet."}</p>`}</div>`;
  const co = {};
  uses.forEach(u => u.o.pieces.forEach(p => { if (p.id !== g.id && byId[p.id] && !(g.set_id && byId[p.id].set_id === g.set_id)) co[p.id] = (co[p.id]||0) + 1; }));
  const top = Object.entries(co).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const coPanel = top.length >= 2 ? `<div class="panel"><h4>Often paired with</h4><div class="inset">${top.map(([id, n]) => { const x = byId[id]; return `<a class="mini" href="#garment-${x.id}"><div class="ph">${ph(x, mainPhoto(x))}</div><span>${esc(x.subcategory)}</span><em>together ${n}×</em></a>`; }).join("")}</div></div>` : "";
  const gallery = g.photos.length ? `<div class="track" id="track" tabindex="0" aria-label="Photos">${g.photos.map((p, i) =>
      `<figure class="slide"><img src="${esc(encodeURI(p.url))}" alt="${esc(title(g))}, ${esc(photoName(p.url))}" ${i > 1 ? 'loading="lazy"' : ""}></figure>`).join("")}</div>
      <div class="gnav"><button type="button" id="gprev" aria-label="Previous photo">‹</button><span id="gcount"></span><button type="button" id="gnext" aria-label="Next photo">›</button></div>`
    : `<div class="ph">${ph(g, null)}</div>`;
  const rows = FIELDS.map(f => `<dt>${esc(f.label)}</dt><dd data-field="${f.key}">${evButton(f.key, f.label, `<span>${displayValue(g, f)}</span>`)}</dd>`).join("");
  const tags = `<div data-field="style_tags">${evButton("style_tags", "style tags",
      g.style_tags.length ? `<span class="tags">${g.style_tags.map(t => `<span class="tg">${esc(t)}</span>`).join("")}</span>` : `<span class="addnote">+ Add style tags</span>`)}</div>`;
  const notes = `<div data-field="notes">${evButton("notes", "your notes", g.notes ? `<p class="notes mine">${esc(g.notes)}</p>` : `<span class="addnote">+ Add your own notes</span>`, "block")}</div>`;
  const label = `<div data-field="label_text">${evButton("label_text", "label text", g.label_text ? `<div class="label">${esc(g.label_text)}</div>` : `<span class="addnote">+ Add label text</span>`, "block")}</div>`;
  return `<button type="button" class="back" data-back="wardrobe" style="margin-top:20px">← Wardrobe</button>
    <div class="detail">
    <div class="gallery">${gallery}</div>
    <div class="info">
      <div><span class="eyebrow">${esc(g.brand || "unknown brand")} · ${esc(g.category)} · #${g.id}</span><h2>${esc(g.subcategory)}</h2></div>
      ${setPanel}
      <p class="notes">${esc(g.styling_notes)}</p>
      ${notes}
      ${outPanel}
      ${coPanel}
      <div class="panel">
        <div class="edit-head"><h3>Details</h3><small>Click any value to correct it</small></div>
        <dl class="kv">${rows}<dt>Added</dt><dd style="padding:6px 0">${esc(g.date_added || "—")}</dd></dl>
        ${tags}
      </div>
      ${label}
    </div></div>`;
}
let galleryGo = null;
function wireGallery(startAt = 0){
  galleryGo = null;
  const track = document.getElementById("track"); if (!track) return;
  const n = track.children.length;
  const idx = () => Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  const labels = [...track.querySelectorAll("img")].map(i => i.alt.split(", ").pop());
  const update = () => { const i = idx();
    document.getElementById("gcount").textContent = `${i + 1} / ${n} · ${labels[i] || ""}`;
    document.getElementById("gprev").disabled = i === 0; document.getElementById("gnext").disabled = i === n - 1; };
  const go = d => track.scrollTo({left:(idx() + d) * track.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  document.getElementById("gprev").onclick = () => go(-1);
  document.getElementById("gnext").onclick = () => go(1);
  track.addEventListener("scroll", () => requestAnimationFrame(update));
  if (startAt) track.scrollLeft = startAt * track.clientWidth;
  galleryGo = go; update();
}
const galleryIndex = () => { const t = document.getElementById("track"); return t ? Math.round(t.scrollLeft / Math.max(1, t.clientWidth)) : 0; };

/* ================= combobox =================
   A text box with a filtered list. Enforced (default): only a listed option can be picked.
   Free: anything typed is accepted, and the list offers suggestions. */
let comboSeq = 0;
function combo(host, {options, current, free = false, placeholder = "Type to filter…", onPick, onCancel, keepOpen = false}){
  const id = "cb" + (++comboSeq);
  host.innerHTML = `<div class="cb${keepOpen ? " inline" : ""}"><input type="text" role="combobox" aria-expanded="true" aria-controls="${id}" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder)}">
    <span class="caret" aria-hidden="true">▾</span><ul role="listbox" id="${id}"></ul></div>
    <div class="hintline">${free ? "Enter to save · Esc to cancel" : "Pick from the list · Esc to cancel"}</div>`;
  const wrap = host.querySelector(".cb"), input = wrap.querySelector("input"), list = wrap.querySelector("ul"), hint = host.querySelector(".hintline");
  const curOpt = options.find(o => o.value === current);
  input.value = curOpt ? curOpt.label : (free && current ? String(current) : "");
  let typed = false, active = -1, shown = [], done = false;
  const norm = s => String(s).toLowerCase().trim();
  function render(){
    const q = typed ? norm(input.value) : "";
    shown = q ? options.filter(o => norm(o.label).includes(q) || norm(o.value ?? "").includes(q)) : options.slice();
    const exact = free && q && options.some(o => norm(o.label) === q);
    let html = shown.map((o, i) => `<li role="option" id="${id}-${i}" data-i="${i}" aria-selected="${i === active}" class="${o.value === current ? "cur" : ""}">${o.hex ? `<span class="chip" style="background:${o.hex}"></span>` : ""}${esc(o.label)}</li>`).join("");
    if (free && q && !exact) html = `<li role="option" id="${id}-free" data-free="1" class="free" aria-selected="${active === shown.length}">Use <b>“${esc(input.value.trim())}”</b></li>` + html;
    if (!html) html = `<li class="nomatch" aria-disabled="true">No match. Clear the box to see every option.</li>`;
    list.innerHTML = html;
    const el = active >= 0 ? list.querySelector(`[aria-selected="true"]`) : null;
    if (el){ input.setAttribute("aria-activedescendant", el.id); el.scrollIntoView({block:"nearest"}); } else input.removeAttribute("aria-activedescendant");
    wrap.classList.remove("invalid"); hint.classList.remove("err");
    hint.textContent = keepOpen ? (free ? "Enter to add · Esc when done" : "Pick to add · Esc when done") : free ? "Enter to save · Esc to cancel" : "Pick from the list · Esc to cancel";
  }
  const freeRowCount = () => (list.querySelector("[data-free]") ? 1 : 0);
  function pickIndex(i){ if (done) return; done = !keepOpen; onPick(shown[i].value); if (keepOpen){ input.value = ""; typed = false; active = -1; render(); input.focus(); } }
  function pickFree(){ if (done) return; const v = input.value.trim(); done = !keepOpen; onPick(v === "" ? null : v); if (keepOpen){ input.value = ""; typed = false; render(); input.focus(); } }
  function cancel(){ if (done) return; done = true; onCancel && onCancel(); }
  function reject(){ wrap.classList.add("invalid"); hint.classList.add("err"); hint.textContent = "Not one of the options. Pick one from the list."; }
  function commitTyped(){
    const q = norm(input.value);
    if (!typed) return keepOpen ? null : cancel();
    const exactI = shown.findIndex(o => norm(o.label) === q || norm(o.value ?? "") === q);
    if (exactI >= 0) return pickIndex(exactI);
    if (free) return pickFree();
    if (shown.length === 1) return pickIndex(0);
    reject();
  }
  input.addEventListener("input", () => { typed = true; active = norm(input.value) ? 0 : -1; render(); });
  input.addEventListener("keydown", e => {
    const total = shown.length + freeRowCount();
    if (e.key === "ArrowDown"){ e.preventDefault(); active = Math.min(total - 1, active + 1); render(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); active = Math.max(0, active - 1); render(); }
    else if (e.key === "Enter"){ e.preventDefault();
      const sel = list.querySelector('[aria-selected="true"]');
      if (sel && sel.dataset.free) pickFree(); else if (sel && sel.dataset.i !== undefined) pickIndex(+sel.dataset.i); else commitTyped(); }
    else if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); cancel(); }
    else if (e.key === "Tab" && !keepOpen){ if (typed) commitTyped(); else cancel(); }
  });
  list.addEventListener("mousedown", e => {
    const li = e.target.closest("li"); if (!li || li.classList.contains("nomatch")) return;
    e.preventDefault();
    if (li.dataset.free) pickFree(); else pickIndex(+li.dataset.i);
  });
  input.addEventListener("blur", () => setTimeout(() => {
    if (done || host.contains(document.activeElement)) return;
    if (keepOpen) return;
    if (!typed) return cancel();
    const q = norm(input.value);
    if (free) return pickFree();
    const exactI = shown.findIndex(o => norm(o.label) === q);
    if (exactI >= 0) pickIndex(exactI); else cancel();
  }, 120));
  render();
  input.focus(); input.select();
  return {input};
}

/* ================= editing ================= */
let saving = false;
async function save(g, changes){
  if (saving) return;
  saving = true;
  try {
    const updated = await api(`/api/garments/${g.id}`, {method: "PATCH", body: changes});
    const i = G.findIndex(x => x.id === g.id);
    G[i] = updated;
    O.forEach(o => o.garments.forEach(x => { if (x.garment.id === g.id) x.garment = updated; }));
    reindex();
    toast("Saved");
  } catch (e) {
    toast(e.message, true);
  } finally {
    saving = false;
    refresh();
  }
}
const colorOptions = () => OPT.colors.map(c => ({value: c.name, label: c.name, hex: c.hex}));
const NONE = {value: null, label: "— none"};

function openEditor(field){
  const g = currentGarment(); if (!g) return;
  const host = document.querySelector(`[data-field="${field}"]`); if (!host) return;
  const f = FIELDS.find(x => x.key === field);
  const cancel = () => refresh();
  const setOne = v => { if (v === g[field]) return refresh(); save(g, {[field]: v}); };

  if (field === "category"){
    combo(host, {options: OPT.categories.map(c => ({value: c, label: c})), current: g.category, onCancel: cancel,
      onPick: v => {
        if (v === g.category) return refresh();
        const sub = document.querySelector('[data-field="subcategory"]');
        host.innerHTML = `<span class="cchip">${esc(v)}</span><div class="hintline">Now pick a ${esc(v)} subcategory to save</div>`;
        subcategoryEditor(sub, g, v);
      }});
  } else if (field === "subcategory"){
    subcategoryEditor(host, g, g.category);
  } else if (f && f.kind === "color"){
    combo(host, {options: colorOptions(), current: g[field], onCancel: cancel, onPick: setOne});
  } else if (f && f.kind === "colors"){
    multiEditor(host, g, field, colorOptions(), false);
  } else if (f && (f.kind === "level" || f.kind === "choice")){
    const opts = f.list().map(l => ({value: l.value, label: f.kind === "level" ? `${l.value} · ${l.label}` : l.label}));
    combo(host, {options: [...opts, NONE], current: g[field], onCancel: cancel, onPick: setOne});
  } else if (f && f.kind === "text"){
    combo(host, {options: f.suggest().map(v => ({value: v, label: v})), current: g[field], free: true, placeholder: "Type a value…", onCancel: cancel, onPick: setOne});
  } else if (field === "materials"){
    materialsEditor(host, g);
  } else if (field === "style_tags"){
    multiEditor(host, g, field, unique(G.flatMap(x => x.style_tags)).map(t => ({value: t, label: t})), true);
  } else if (field === "notes" || field === "label_text"){
    textEditor(host, g, field);
  }
}
function subcategoryEditor(host, g, category){
  const opts = (OPT.subcategories[category] || []).map(s => ({value: s, label: s}));
  combo(host, {options: opts, current: category === g.category ? g.subcategory : null, placeholder: `Type to filter ${category} subcategories…`,
    onCancel: () => refresh(),
    onPick: v => {
      if (category === g.category && v === g.subcategory) return refresh();
      save(g, category === g.category ? {subcategory: v} : {category, subcategory: v});
    }});
}
function multiEditor(host, g, field, options, free){
  const values = g[field].slice();
  const isColor = field !== "style_tags";
  host.innerHTML = `<div class="multi"><div class="have">${values.map((v, i) => `<span class="pill">${isColor ? `<span class="chip" style="background:${hex(v)}"></span>` : ""}${esc(v)}<button type="button" data-rm="${i}" aria-label="Remove ${esc(v)}">×</button></span>`).join("") || `<span class="empty">None yet</span>`}</div>
    <div class="btns"><button type="button" class="btn done-btn">Done</button><span class="hintline">Changes save as you go</span></div>
    <div class="adder"></div></div>`;
  host.querySelector(".have").addEventListener("click", e => {
    const b = e.target.closest("[data-rm]"); if (!b) return;
    const next = values.filter((_, i) => i !== +b.dataset.rm);
    save(g, {[field]: next}).then(() => openEditor(field));
  });
  host.querySelector(".done-btn").addEventListener("click", () => refresh());
  combo(host.querySelector(".adder"), {options: options.filter(o => !values.includes(o.value)), free, keepOpen: true,
    placeholder: isColor ? "Add a color…" : "Add a tag…",
    onPick: v => { if (v === null || values.includes(v)) return; save(g, {[field]: [...values, v]}).then(() => openEditor(field)); }});
  host.addEventListener("keydown", e => { if (e.key === "Escape") refresh(); });
}
function textEditor(host, g, field){
  host.innerHTML = `<textarea class="txt" rows="${field === "label_text" ? 5 : 3}" spellcheck="${field === "notes"}">${esc(g[field] || "")}</textarea>
    <div class="btns" style="margin-top:8px"><button type="button" class="btn primary" data-act="save">Save</button><button type="button" class="btn quiet" data-act="cancel">Cancel</button><span class="hintline">Ctrl+Enter to save · Esc to cancel</span></div>`;
  const ta = host.querySelector("textarea");
  const commit = () => { const v = ta.value.trim() || null; if (v === (g[field] || null)) return refresh(); save(g, {[field]: v}); };
  host.querySelector('[data-act="save"]').onclick = commit;
  host.querySelector('[data-act="cancel"]').onclick = () => refresh();
  ta.addEventListener("keydown", e => {
    if (e.key === "Escape"){ e.preventDefault(); refresh(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); commit(); }
  });
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function materialsEditor(host, g){
  let parts = JSON.parse(JSON.stringify(g.materials));
  const fibers = unique(G.flatMap(x => x.materials.flatMap(m => m.fibers.map(f => f.fiber))));
  const partNames = unique(G.flatMap(x => x.materials.map(m => m.part)));
  const listId = "fibers-" + g.id, partId = "parts-" + g.id;
  function draw(){
    host.innerHTML = `<div class="mats">
      <datalist id="${listId}">${fibers.map(f => `<option value="${esc(f)}">`).join("")}</datalist>
      <datalist id="${partId}">${partNames.map(f => `<option value="${esc(f)}">`).join("")}</datalist>
      ${parts.map((m, pi) => { const sum = m.fibers.reduce((n, f) => n + (+f.percent || 0), 0); return `<div class="mpart">
        <div class="top"><input class="txt" list="${partId}" data-p="${pi}" data-k="part" value="${esc(m.part || "")}" placeholder="Part (optional, e.g. shell, lining)" aria-label="Part name">
          ${parts.length > 1 ? `<button type="button" class="x" data-rmpart="${pi}" aria-label="Remove this part">×</button>` : ""}</div>
        ${m.fibers.map((f, fi) => `<div class="frow"><input class="txt" list="${listId}" data-p="${pi}" data-f="${fi}" data-k="fiber" value="${esc(f.fiber)}" placeholder="Fiber" aria-label="Fiber">
          <span class="pct"><input class="num" type="number" min="1" max="100" step="1" data-p="${pi}" data-f="${fi}" data-k="percent" value="${f.percent}" aria-label="Percent"></span>
          <button type="button" class="x" data-rmfiber="${pi}:${fi}" aria-label="Remove this fiber">×</button></div>`).join("")}
        <div class="btns"><button type="button" class="btn quiet" data-addfiber="${pi}">+ Fiber</button><span class="msum${sum === 100 ? "" : " off"}">total ${sum}%</span></div>
      </div>`; }).join("")}
      <div class="btns"><button type="button" class="btn quiet" data-addpart>+ Part</button></div>
      <div class="btns"><button type="button" class="btn primary" data-act="save">Save materials</button><button type="button" class="btn quiet" data-act="cancel">Cancel</button><span class="hintline" id="materr"></span></div>
    </div>`;
  }
  draw();
  host.addEventListener("input", e => {
    const el = e.target; if (!el.dataset.k) return;
    const m = parts[+el.dataset.p];
    if (el.dataset.k === "part") m.part = el.value;
    else if (el.dataset.k === "fiber") m.fibers[+el.dataset.f].fiber = el.value;
    else if (el.dataset.k === "percent"){ m.fibers[+el.dataset.f].percent = el.value === "" ? "" : +el.value;
      const sum = m.fibers.reduce((n, f) => n + (+f.percent || 0), 0);
      const s = el.closest(".mpart").querySelector(".msum"); s.textContent = `total ${sum}%`; s.classList.toggle("off", sum !== 100); }
  });
  host.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.addfiber !== undefined){ parts[+t.dataset.addfiber].fibers.push({fiber: "", percent: ""}); draw(); focusLast(+t.dataset.addfiber); }
    else if (t.dataset.rmfiber){ const [p, f] = t.dataset.rmfiber.split(":").map(Number); parts[p].fibers.splice(f, 1); draw(); }
    else if (t.dataset.rmpart !== undefined){ parts.splice(+t.dataset.rmpart, 1); draw(); }
    else if (t.dataset.addpart !== undefined){ parts.push({part: "", fibers: [{fiber: "", percent: ""}]}); draw(); focusLast(parts.length - 1); }
    else if (t.dataset.act === "cancel") refresh();
    else if (t.dataset.act === "save"){
      const err = host.querySelector("#materr");
      const clean = parts.map(m => ({part: (m.part || "").trim() || null, fibers: m.fibers.filter(f => String(f.fiber).trim() || f.percent !== "")
        .map(f => ({fiber: String(f.fiber).trim(), percent: f.percent === "" ? NaN : Number(f.percent)}))})).filter(m => m.fibers.length);
      const bad = clean.flatMap(m => m.fibers).find(f => !f.fiber || !Number.isInteger(f.percent) || f.percent < 1 || f.percent > 100);
      if (bad){ err.textContent = "Each fiber needs a name and a whole-number percent from 1 to 100."; err.classList.add("err"); return; }
      save(g, {materials: clean});
    }
  });
  host.addEventListener("keydown", e => { if (e.key === "Escape") refresh(); });
  function focusLast(pi){ const els = host.querySelectorAll(`[data-p="${pi}"][data-k="fiber"]`); (els[els.length - 1] || host.querySelector(`[data-p="${pi}"]`))?.focus(); }
  host.querySelector("input")?.focus();
}

/* ================= likes ================= */
async function rate(o, value){
  const next = o.liked === value ? null : value;
  try {
    const updated = adoptOutfit(await api(`/api/outfits/${o.id}`, {method: "PATCH", body: {liked: next}}));
    const i = O.findIndex(x => x.id === o.id);
    O[i] = updated; reindex();
    toast(next === true ? "Liked" : next === false ? "Disliked" : "Rating cleared");
  } catch (e) { toast(e.message, true); }
  refresh();
}

/* ================= routing ================= */
const app = document.getElementById("app");
const scrollMem = {};
let current = null;
const stack = [location.hash || "#wardrobe"];
function currentGarment(){ const m = location.hash.match(/^#garment-(\d+)$/); return m ? byId[m[1]] : null; }
function render(){
  const h = location.hash.slice(1);
  let m, view = "wardrobe", html;
  if ((m = h.match(/^garment-(\d+)$/))){
    const g = byId[m[1]];
    view = "garment";
    html = g ? garmentPage(g) : `<div class="state"><h1>Garment not found</h1><p><a href="#wardrobe">Back to the wardrobe</a></p></div>`;
    document.title = g ? `${title(g)} · enclothed` : "enclothed";
  } else if ((m = h.match(/^outfit-(\d+)$/))){
    const o = outById[m[1]];
    view = "outfit";
    html = o ? outfitPage(o) : `<div class="state"><h1>Outfit not found</h1><p><a href="#outfits">Back to outfits</a></p></div>`;
    document.title = o ? `${o.aesthetic} · enclothed` : "enclothed";
  } else if (h === "outfits"){ view = "outfits"; html = outfits(); document.title = "Outfits · enclothed"; }
  else { html = wardrobe(); document.title = "enclothed"; }
  app.innerHTML = html;
  const section = (view === "outfit" || view === "outfits") ? "outfits" : "wardrobe";
  for (const k of ["wardrobe", "outfits"]){ const n = document.getElementById("nav-" + k);
    if (k === section) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current"); }
  const prev = stack.length > 1 ? stack[stack.length - 2] : null;
  const bk = app.querySelector("[data-back]");
  if (bk && prev){ const pm = prev.match(/^#(garment|outfit)-/); bk.textContent = pm ? `← Back to ${pm[1]}` : (prev === "#outfits" ? "← Outfits" : "← Wardrobe"); }
  return view;
}
function route(){
  if (current === "wardrobe" || current === "outfits") scrollMem[current] = scrollY;
  const view = render();
  current = view;
  if (view === "garment") wireGallery();
  scrollTo(0, (view === "wardrobe" || view === "outfits") ? (scrollMem[view] || 0) : 0);
}
/* Re-draw the current page after a change, keeping scroll and photo position. */
function refresh(){
  const y = scrollY, gi = galleryIndex();
  const view = render();
  if (view === "garment") wireGallery(gi);
  scrollTo(0, y);
}
addEventListener("hashchange", () => {
  const h = location.hash || "#wardrobe";
  if (stack.length > 1 && stack[stack.length - 2] === h) stack.pop(); else if (stack[stack.length - 1] !== h) stack.push(h);
  route();
});
app.addEventListener("click", e => {
  const f = e.target.closest("[data-cat],[data-scope],[data-req],[data-toggle-disliked]");
  if (f){
    if (f.dataset.cat) cat = f.dataset.cat;
    if (f.dataset.scope) scope = f.dataset.scope;
    if (f.dataset.req) req = f.dataset.req;
    if (f.hasAttribute("data-toggle-disliked")){ showDisliked = !showDisliked; store.set("enclothed-show-disliked", showDisliked); }
    refresh(); return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed){ openEditor(ed.dataset.edit); return; }
  const r = e.target.closest("[data-rate]");
  if (r){ const m = location.hash.match(/^#outfit-(\d+)$/); if (m && outById[m[1]]) rate(outById[m[1]], r.dataset.rate === "true"); return; }
  const b = e.target.closest("[data-back]");
  if (b){ if (stack.length > 1) history.back(); else location.hash = b.dataset.back; }
});
addEventListener("keydown", e => {
  if (!galleryGo || e.target.closest("input,textarea,[role=combobox]")) return;
  if (e.key === "ArrowRight"){ e.preventDefault(); galleryGo(1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); galleryGo(-1); }
});

/* ================= Day / Evening ================= */
function paintTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  document.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
}
document.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", b.dataset.t);
  try { localStorage.setItem("enclothed-theme", b.dataset.t); } catch (e) {}
  paintTheme();
}));
paintTheme();

/* ================= start ================= */
(async function start(){
  try {
    const [garments, outfitList, sets, options, profile] = await Promise.all([
      api("/api/garments"), api("/api/outfits"), api("/api/sets"), api("/api/options"), api("/api/profile")]);
    G = garments; O = outfitList.map(adoptOutfit); SETS = sets; OPT = options;
    HEX = Object.fromEntries(options.colors.map(c => [c.name, c.hex]));
    document.getElementById("who").textContent = profile.name;
    reindex();
    route();
  } catch (e) {
    app.innerHTML = `<div class="state"><h1>Couldn't load your wardrobe</h1><p>${esc(e.message)}</p><p>Check that the server is running (<code>uv run fastapi dev src/enclothed/api.py</code>), then refresh.</p></div>`;
  }
})();
</script>
