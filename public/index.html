<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>enclothed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* Bright by default; the viewer's own Day/Evening choice wins. Runs before the CSS so the page never flashes. */
(function(){ let t = null; try { t = localStorage.getItem("enclothed-theme"); } catch (e) {}
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); })();
</script>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="logo" href="#wardrobe"><b>enclothed</b><span id="who"></span></a>
  <nav class="seg" aria-label="Sections"><a href="#wardrobe" id="nav-wardrobe">Wardrobe</a><a href="#outfits" id="nav-outfits">Outfits</a></nav>
  <div class="seg" role="group" aria-label="Backdrop">
    <button type="button" data-t="light" title="Bright, neutral backdrop"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></g></svg>Day</button>
    <button type="button" data-t="dark" title="Dark backdrop"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg>Evening</button>
  </div>
</div></div>

<div class="wrap" id="app"><div class="state"><p>Loading your wardrobe…</p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= state ================= */
let G = [], O = [], SETS = [], OPT = null;
let byId = {}, outById = {}, setById = {}, outfitsOf = {}, REQUESTS = [], HEX = {};
const RAIL_ORDER = ["outerwear", "top", "bottom", "one-piece", "shoes", "accessory"];

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let showDisliked = store.get("enclothed-show-disliked", false);

/* ================= helpers ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hex = c => HEX[c] || "#999999";
const pips = (n, max) => `<span class="pips">${Array.from({length:max},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join("")}</span>`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const when = ts => new Date(ts).toLocaleDateString(undefined, {month:"short", day:"numeric"});
const whenLong = ts => new Date(ts).toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
const catRank = g => { const i = RAIL_ORDER.indexOf(g?.category); return i < 0 ? 99 : i; };
const setName = s => s ? (s.name || `Set #${s.id}`) : "";
const title = g => [g.brand, g.subcategory].filter(Boolean).join(" ");
const levelLabel = (list, v) => (list.find(l => l.value === v) || {}).label || "";
const choiceLabel = (list, v) => (list.find(l => l.value === v) || {}).label || v;
const unique = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b));
const SET_ICON = `<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="1.5" y="4.5" width="8" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="6.5" y="1.5" width="8" height="10" rx="1.5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/></svg>`;
const PEN = `<svg class="pen" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.3 2.3a1.6 1.6 0 0 1 2.3 2.3L5.4 12.8l-3 .8.8-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const THUMB_UP = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 7v7H2.5V7zM5 7l3-5c1.2 0 1.8.8 1.6 2L9.2 6.5h3.6c.9 0 1.5.8 1.3 1.6l-1.2 4.9c-.2.6-.7 1-1.3 1H5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const THUMB_DOWN = `<svg viewBox="0 0 16 16" aria-hidden="true" style="transform:rotate(180deg)"><path d="M5 7v7H2.5V7zM5 7l3-5c1.2 0 1.8.8 1.6 2L9.2 6.5h3.6c.9 0 1.5.8 1.3 1.6l-1.2 4.9c-.2.6-.7 1-1.3 1H5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;

const photoName = url => decodeURIComponent(url.split("/").pop()).replace(/\.\w+$/, "");
const mainPhoto = g => g.photos.length ? g.photos[0].url : null;
const thumb = g => g.photos.length ? g.photos[0].thumb_url : null;

let toastTimer = null;
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.toggle("err", !!isErr); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), isErr ? 6000 : 1800);
}

/* ================= API ================= */
async function api(path, options = {}){
  const init = {headers: {"Accept": "application/json"}, ...options};
  if (options.body !== undefined){ init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(options.body); }
  let res;
  try { res = await fetch(path, init); }
  catch (e) { throw new Error("Couldn't reach the server. Is it still running?"); }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(errorText(data, res.status));
  return data;
}
function errorText(data, status){
  const d = data && data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d) && d.length) return d.map(e => {
    const field = (e.loc || []).filter(x => x !== "body" && typeof x === "string").join(" › ");
    return (field ? field + ": " : "") + String(e.msg || "").replace(/^Value error, /, "");
  }).join("; ");
  return `Request failed (${status})`;
}

/* ================= indexes ================= */
function adoptOutfit(o){
  o.pieces = o.garments.map(x => ({id: x.garment.id, advice: x.styling_advice, anchor: x.is_anchor}));
  return o;
}
function reindex(){
  byId = Object.fromEntries(G.map(g => [g.id, g]));
  outById = Object.fromEntries(O.map(o => [o.id, o]));
  setById = Object.fromEntries(SETS.map(s => [s.id, s]));
  O.forEach(o => o.pieces.sort((a, b) => catRank(byId[a.id]) - catRank(byId[b.id])));
  outfitsOf = {};
  O.forEach(o => o.pieces.forEach(p => (outfitsOf[p.id] ||= []).push({o, advice: p.advice, anchor: p.anchor})));
  REQUESTS = [];
  O.forEach(o => { let r = REQUESTS.find(x => x.text === o.prompt_message); if (!r) REQUESTS.push(r = {text: o.prompt_message, items: []}); r.items.push(o); });
  REQUESTS.forEach((r, i) => r.key = "r" + i);
}
const reqOf = o => REQUESTS.find(r => r.text === o.prompt_message);
const visible = o => showDisliked || o.liked !== false;

/* ================= shared bits ================= */
function ph(g, src, eager){
  return src ? `<img src="${esc(encodeURI(src))}" alt="" ${eager ? "" : 'loading="lazy"'} decoding="async">`
             : `<span class="sw" style="background:${hex(g.primary_color)}"></span>`;
}
function palette(o){
  const seg = [];
  o.pieces.forEach(p => { const c = byId[p.id]?.primary_color; const last = seg[seg.length-1]; if (last && last.c === c) last.n++; else seg.push({c, n:1}); });
  return seg;
}
const palBar = (o, cls="") => `<div class="pal ${cls}" role="img" aria-label="Palette: ${esc(palette(o).map(s=>s.c).join(", "))}">${palette(o).map(s => `<i style="flex:${s.n};background:${hex(s.c)}" title="${esc(s.c)}"></i>`).join("")}</div>`;
const vPal = o => `<span class="vpal" aria-hidden="true">${palette(o).map(s => `<i style="flex:${s.n};background:${hex(s.c)}"></i>`).join("")}</span>`;

/* ================= wardrobe ================= */
let cat = "all", scope = "any";
function gCard(g){
  const s = setById[g.set_id];
  const chips = [g.primary_color, ...g.secondary_colors, ...g.accent_colors].filter(Boolean)
    .map(c => `<span class="chip" title="${esc(c)}" style="background:${hex(c)}"></span>`).join("");
  const n = (outfitsOf[g.id] || []).length;
  const picked = builder.pieces.includes(g.id);
  return `<div class="cardwrap${picked ? " picked" : ""}"><a class="card" href="#garment-${g.id}" aria-label="${esc(title(g))}, ${esc(g.primary_color)}">
    <div class="ph">${ph(g, thumb(g))}<span class="badge id">#${g.id}</span>
      ${s ? `<span class="badge set" title="Part of a set: ${esc(setName(s))}">${SET_ICON}<b>${esc(setName(s))}</b></span>` : ""}</div>
    <div class="meta">
      <span class="brand">${esc(g.brand || "unknown brand")}</span>
      <span class="sc">${esc(g.subcategory)}</span>
      <span class="chips">${chips}</span>
      <span class="row"><span class="scales"><span>F${pips(g.formality||0,4)}</span><span>W${pips(g.warmth||0,5)}</span></span><span>${n ? plural(n,"outfit") : "no outfits"}</span></span>
    </div></a><span class="addlayer">${pickButton(g)}</span></div>`;
}
function wardrobe(){
  if (!G.length) return `<div class="state"><h1>Your wardrobe is empty</h1><p>Photograph a garment to add it.</p><p><button type="button" class="btn primary" data-add-garment>+ Add garment</button></p></div>`;
  const inScope = g => scope === "any" || (scope === "sets" && g.set_id) || (scope === "unstyled" && !outfitsOf[g.id]);
  const pool = G.filter(inScope);
  const cats = RAIL_ORDER.filter(c => G.some(g => g.category === c));
  const brands = new Set(G.map(g => g.brand).filter(Boolean)).size;
  const nUnstyled = G.filter(g => !outfitsOf[g.id]).length, nSet = G.filter(g => g.set_id).length;
  const btn = (k, v, label, n) => `<button type="button" data-${k}="${esc(v)}" aria-pressed="${(k==='cat'?cat:scope)===v}">${esc(label)} <span>${n}</span></button>`;
  const rails = cats.filter(c => cat === "all" || c === cat).map(c => {
    const items = pool.filter(g => g.category === c);
    return items.length ? `<section class="rail" id="rail-${esc(c)}"><h2>${esc(c)} <span>${items.length}</span></h2><div class="grid">${items.map(gCard).join("")}</div></section>` : "";
  }).join("") || `<p class="empty">Nothing matches these filters.</p>`;
  return `<header class="hero"><div><h1>The wardrobe</h1><p class="sub">Every garment, as tagged from its photos. Open one to see its set, every outfit it has been styled into, and to correct any tag.</p>
      <div class="hero-actions"><button type="button" class="btn primary" data-add-garment>+ Add garment</button><button type="button" class="btn" data-builder-open>${builder.open ? "Outfit builder is open" : "Put together an outfit"}</button></div></div>
    <div class="stats"><div><b>${G.length}</b>garments</div><div><b>${brands}</b>brands</div><div><b>${SETS.length}</b>sets</div><div><b>${O.length}</b>outfits</div></div></header>
    <div class="filters" role="toolbar" aria-label="Filter garments">
      ${btn("cat","all","All",pool.length)}${cats.map(c => btn("cat", c, c, pool.filter(g => g.category === c).length)).join("")}
      <span class="sep" aria-hidden="true"></span>
      ${btn("scope","any","Any",G.length)}${btn("scope","sets","In a set",nSet)}${btn("scope","unstyled","Not in any outfit",nUnstyled)}
    </div>
    <main style="display:flex;flex-direction:column;gap:30px">${rails}</main>`;
}

/* ================= outfits ================= */
let req = "all";
/* An outfit can only be as formal as its least formal piece (a garment's formality is the most
   formal occasion it can serve), and it's as warm as its warmest top layer (outerwear, top, or
   one-piece; bottoms, shoes and accessories rarely decide the temperature). Pieces without a
   value are ignored. Both are computed from the garments, so they stay right after edits. */
const WARM_LAYERS = new Set(["outerwear", "top", "one-piece"]);
function outfitFormality(o){ const v = o.pieces.map(p => byId[p.id]?.formality).filter(Boolean); return v.length ? Math.min(...v) : null; }
function outfitWarmth(o){ const v = o.pieces.map(p => byId[p.id]).filter(g => g && WARM_LAYERS.has(g.category) && g.warmth).map(g => g.warmth); return v.length ? Math.max(...v) : null; }
function rateButtons(o){
  const b = (v, icon, verb) => `<button type="button" class="ratebtn" data-rate="${v}" data-rate-id="${o.id}" aria-pressed="${o.liked === v}" aria-label="${verb} ${esc(o.aesthetic)}" title="${o.liked === v ? "Clear rating" : verb}">${icon}</button>`;
  return `<div class="ocard-rate" role="group" aria-label="Rate this outfit">${b(true, THUMB_UP, "Like")}${b(false, THUMB_DOWN, "Dislike")}</div>`;
}
function oCard(o){
  const pcs = o.pieces.map(p => byId[p.id]).filter(Boolean);
  const f = outfitFormality(o), w = outfitWarmth(o);
  return `<div class="ocardwrap${o.liked === false ? " disliked" : ""}"><a class="ocard" href="#outfit-${o.id}">
    <div class="flat" aria-hidden="true">${pcs.map(g => `<span>${ph(g, thumb(g))}</span>`).join("")}</div>
    ${palBar(o)}
    <div class="obody"><h3>${esc(o.aesthetic)}</h3><p class="clamp">${esc(o.explanation)}</p>
      <div class="ofoot"><span>${when(o.timestamp)}</span><span>${plural(pcs.length,"piece")}</span>
        <span title="Formality: ${f ? esc(levelLabel(OPT.formality, f)) : "unknown"} (least formal piece)">F${pips(f || 0, 4)}</span>
        <span title="Warmth: ${w ? esc(levelLabel(OPT.warmth, w)) : "unknown"} (warmest top layer)">W${pips(w || 0, 5)}</span>
        ${o.missing ? "<span>needs extras</span>" : ""}</div></div></a>${rateButtons(o)}</div>`;
}
let ofilt = {q: "", from: "", to: "", formality: [], warmth: []};
const filtersActive = () => !!(ofilt.q.trim() || ofilt.from || ofilt.to || ofilt.formality.length || ofilt.warmth.length);
const localDay = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function passesFilters(o){
  const q = ofilt.q.trim().toLowerCase();
  if (q && !o.prompt_message.toLowerCase().includes(q)) return false;
  const day = localDay(o.timestamp);
  if (ofilt.from && day < ofilt.from) return false;
  if (ofilt.to && day > ofilt.to) return false;
  if (ofilt.formality.length && !ofilt.formality.includes(outfitFormality(o))) return false;
  if (ofilt.warmth.length && !ofilt.warmth.includes(outfitWarmth(o))) return false;
  return true;
}
function filterPanel(){
  const chip = (kind, l, label, full) => `<button type="button" data-ofilt-${kind}="${l.value}" aria-pressed="${ofilt[kind === "f" ? "formality" : "warmth"].includes(l.value)}" title="${esc(full)}">${esc(label)}</button>`;
  return `<div class="ofilters" role="search" aria-label="Filter outfits">
    <div class="field"><label for="of-q">Request contains</label><input id="of-q" class="txt" type="search" data-ofilt="q" value="${esc(ofilt.q)}" placeholder="e.g. dinner" autocomplete="off"></div>
    <div class="field"><label for="of-from">From</label><input id="of-from" class="txt" type="date" data-ofilt="from" value="${esc(ofilt.from)}" max="${esc(ofilt.to)}"></div>
    <div class="field"><label for="of-to">To</label><input id="of-to" class="txt" type="date" data-ofilt="to" value="${esc(ofilt.to)}" min="${esc(ofilt.from)}"></div>
    <div class="field wide"><span class="flabel">Formality <em>(of the least formal piece)</em></span><div class="filters">${OPT.formality.map(l => chip("f", l, l.label, `${l.value} · ${l.label}`)).join("")}</div></div>
    <div class="field wide"><span class="flabel">Warmth <em>(of the warmest top layer)</em></span><div class="filters">${OPT.warmth.map(l => chip("w", l, l.label.split(",")[0], `${l.value} · ${l.label}`)).join("")}</div></div>
    ${filtersActive() ? `<button type="button" class="btn quiet" data-ofilt-clear>Clear filters</button>` : ""}
  </div>`;
}
function outfits(){
  if (!O.length) return `<header class="hero"><div><h1>Outfits</h1><div class="hero-actions"><button type="button" class="btn primary" data-new-outfit>+ New outfit</button></div></div></header><div class="state"><p>No outfits yet. Start one with “New outfit”.</p></div>`;
  const groups = [...REQUESTS].reverse().map(r => ({...r, shown: r.items.filter(o => visible(o) && passesFilters(o))})).filter(r => r.shown.length);
  const nDisliked = O.filter(o => o.liked === false).length;
  if (req !== "all" && !groups.some(r => r.key === req)) req = "all";
  const shownTotal = groups.reduce((n, r) => n + r.shown.length, 0);
  const btn = (k, label, n, full) => `<button type="button" data-req="${k}" aria-pressed="${req===k}" title="${esc(full||label)}">${esc(label)} <span>${n}</span></button>`;
  const toggle = nDisliked ? `<span class="sep" aria-hidden="true"></span><button type="button" data-toggle-disliked aria-pressed="${showDisliked}">${showDisliked ? "Showing" : "Show"} disliked <span>${nDisliked}</span></button>` : "";
  const shown = groups.filter(r => req === "all" || r.key === req);
  return `<header class="hero"><div><h1>Outfits</h1><p class="sub">Every outfit suggested so far, grouped by what you asked for. The stripe is each piece's main color, outer layer down to shoes.</p>
      <div class="hero-actions"><button type="button" class="btn primary" data-new-outfit>+ New outfit</button>${builder.session ? `<a class="btn" href="#results" style="text-decoration:none">Latest suggestions</a>` : ""}</div></div>
    <div class="stats"><div><b>${O.length}</b>outfits</div><div><b>${REQUESTS.length}</b>requests</div><div><b>${O.filter(o => o.liked).length}</b>liked</div></div></header>
    ${filterPanel()}
    <div class="filters" role="toolbar" aria-label="Filter by request">${btn("all","All requests",shownTotal)}${groups.map(r => btn(r.key, r.text, r.shown.length, r.text)).join("")}${toggle}</div>
    <main style="display:flex;flex-direction:column;gap:34px">${shown.length ? shown.map(r => `<section class="rail"><h2 class="req"><q>${esc(r.text)}</q> <span>${plural(r.shown.length,"option")}</span></h2>
      <div class="ogrid">${r.shown.map(oCard).join("")}</div></section>`).join("") : `<p class="empty">${filtersActive() ? "No outfits match these filters." : "Every outfit here is disliked. Use “Show disliked” to see them."}</p>`}</main>`;
}

/* ================= outfit page ================= */
function outfitPage(o){
  const r = reqOf(o), i = r.items.indexOf(o);
  const prev = r.items[i-1], next = r.items[i+1];
  const names = palette(o).map(s => `<span><i style="background:${hex(s.c)}"></i>${esc(s.c)}</span>`).join("");
  const rateBtn = (v, icon, label) => `<button type="button" data-rate="${v}" aria-pressed="${o.liked === v}">${icon}${label}</button>`;
  return `<div class="ohead">
      <button type="button" class="back" data-back="outfits">← Outfits</button>
      <p class="req">Asked for <q>${esc(o.prompt_message)}</q> · ${esc(whenLong(o.timestamp))}</p>
      <h1>${esc(o.aesthetic)}</h1>
      ${palBar(o, "big")}<div class="palnames">${names}</div>
      <div class="rate"><div class="seg" role="group" aria-label="Rate this outfit">${rateBtn(true, THUMB_UP, "Like")}${rateBtn(false, THUMB_DOWN, "Dislike")}</div>
        <small>${o.liked === null || o.liked === undefined ? "Not rated" : "Click again to clear"}</small></div>
      <p class="lede">${esc(o.explanation)}</p>
      ${o.missing ? `<div class="missing"><b>To finish the look</b>${esc(o.missing)}</div>` : ""}
      ${r.items.length > 1 ? `<nav class="pager" aria-label="Other options for this request">
        <a href="${prev ? "#outfit-"+prev.id : "#"}" aria-disabled="${!prev}">‹ Prev</a>
        <span>Option ${i+1} of ${r.items.length} for this request</span>
        <a href="${next ? "#outfit-"+next.id : "#"}" aria-disabled="${!next}">Next ›</a></nav>` : ""}
    </div>
    <section class="pieces" aria-label="Pieces">${o.pieces.map(p => { const g = byId[p.id]; if (!g) return ""; return `
      <a class="piece" href="#garment-${g.id}">
        <div class="ph">${ph(g, thumb(g))}<span class="badge id">#${g.id}</span>${g.set_id ? `<span class="badge set" title="Part of a set">${SET_ICON}<b>${esc(setName(setById[g.set_id]))}</b></span>` : ""}</div>
        <span class="eyebrow">${esc(g.category)}${p.anchor ? `<span class="anchor" title="You asked for the outfit to be built around this piece">anchor</span>` : ""}</span>
        <span class="nm">${esc(title(g))}</span>
        ${p.advice ? `<p>${esc(p.advice)}</p>` : `<p class="empty">No specific advice for this piece.</p>`}
      </a>`; }).join("")}</section>`;
}

/* ================= garment page ================= */
/* Editable fields: how each one shows, and which editor it opens. */
const FIELDS = [
  {key:"category", label:"Category", kind:"category"},
  {key:"subcategory", label:"Subcategory", kind:"subcategory"},
  {key:"brand", label:"Brand", kind:"text", suggest:() => unique(G.map(g => g.brand))},
  {key:"primary_color", label:"Primary color", kind:"color"},
  {key:"secondary_colors", label:"Secondary", kind:"colors"},
  {key:"accent_colors", label:"Accent", kind:"colors"},
  {key:"formality", label:"Formality", kind:"level", list:() => OPT.formality},
  {key:"warmth", label:"Warmth", kind:"level", list:() => OPT.warmth},
  {key:"fit", label:"Fit", kind:"choice", list:() => OPT.fits},
  {key:"sheen", label:"Sheen", kind:"choice", list:() => OPT.sheens},
  {key:"pattern", label:"Pattern", kind:"text", suggest:() => unique(G.map(g => g.pattern))},
  {key:"materials", label:"Materials", kind:"materials"},
  {key:"country_of_origin", label:"Made in", kind:"text", suggest:() => unique(G.map(g => g.country_of_origin))},
];
const colorChip = c => `<span class="cchip"><span class="chip" style="background:${hex(c)}"></span>${esc(c)}</span>`;
function displayValue(g, f){
  const v = g[f.key];
  const none = `<span class="none">—</span>`;
  switch (f.kind){
    case "color": return colorChip(v);

    default: return v ? esc(v) : none;
  }
}

let galleryGo = null;
function wireGallery(startAt = 0){
  galleryGo = null;
  const track = document.getElementById("track"); if (!track) return;
  const n = track.children.length;
  const idx = () => Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  const labels = [...track.querySelectorAll("img")].map(i => i.alt.split(", ").pop());
  const update = () => { const i = idx();
    document.getElementById("gcount").textContent = `${i + 1} / ${n} · ${labels[i] || ""}`;
    document.getElementById("gprev").disabled = i === 0; document.getElementById("gnext").disabled = i === n - 1; };
  const go = d => track.scrollTo({left:(idx() + d) * track.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  document.getElementById("gprev").onclick = () => go(-1);
  document.getElementById("gnext").onclick = () => go(1);
  track.addEventListener("scroll", () => requestAnimationFrame(update));
  if (startAt) track.scrollLeft = startAt * track.clientWidth;
  galleryGo = go; update();
}
const galleryIndex = () => { const t = document.getElementById("track"); return t ? Math.round(t.scrollLeft / Math.max(1, t.clientWidth)) : 0; };

/* ================= combobox =================
   A text box with a filtered list. Enforced (default): only a listed option can be picked.
   Free: anything typed is accepted, and the list offers suggestions. */
let comboSeq = 0;
function combo(host, {options, current, free = false, placeholder = "Type to filter…", onPick, onCancel, keepOpen = false, autofocus = true, collapsed = false}){
  const id = "cb" + (++comboSeq);
  host.innerHTML = `<div class="cb${keepOpen ? " inline" : ""}"><input type="text" role="combobox" aria-expanded="true" aria-controls="${id}" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder)}">
    <span class="caret" aria-hidden="true">▾</span><ul role="listbox" id="${id}"></ul></div>
    <div class="hintline">${free ? "Enter to save · Esc to cancel" : "Pick from the list · Esc to cancel"}</div>`;
  const wrap = host.querySelector(".cb"), input = wrap.querySelector("input"), list = wrap.querySelector("ul"), hint = host.querySelector(".hintline");
  const curOpt = options.find(o => o.value === current);
  input.value = curOpt ? curOpt.label : (free && current ? String(current) : "");
  let typed = false, active = -1, shown = [], done = false, opened = !collapsed;
  const norm = s => String(s).toLowerCase().trim();
  function render(){
    if (!opened){ list.hidden = true; hint.hidden = true; input.setAttribute("aria-expanded", "false"); return; }
    list.hidden = false; hint.hidden = false; input.setAttribute("aria-expanded", "true");
    const q = typed ? norm(input.value) : "";
    shown = q ? options.filter(o => norm(o.label).includes(q) || norm(o.value ?? "").includes(q)) : options.slice();
    const exact = free && q && options.some(o => norm(o.label) === q);
    let html = shown.map((o, i) => `<li role="option" id="${id}-${i}" data-i="${i}" aria-selected="${i === active}" class="${o.value === current ? "cur" : ""}">${o.hex ? `<span class="chip" style="background:${o.hex}"></span>` : ""}${esc(o.label)}</li>`).join("");
    if (free && q && !exact) html = `<li role="option" id="${id}-free" data-free="1" class="free" aria-selected="${active === shown.length}">Use <b>“${esc(input.value.trim())}”</b></li>` + html;
    if (!html) html = `<li class="nomatch" aria-disabled="true">No match. Clear the box to see every option.</li>`;
    list.innerHTML = html;
    const el = active >= 0 ? list.querySelector(`[aria-selected="true"]`) : null;
    if (el){ input.setAttribute("aria-activedescendant", el.id); el.scrollIntoView({block:"nearest"}); } else input.removeAttribute("aria-activedescendant");
    wrap.classList.remove("invalid"); hint.classList.remove("err");
    hint.textContent = keepOpen ? (free ? "Enter to add · Esc when done" : "Pick to add · Esc when done") : free ? "Enter to save · Esc to cancel" : "Pick from the list · Esc to cancel";
  }
  const freeRowCount = () => (list.querySelector("[data-free]") ? 1 : 0);
  function pickIndex(i){ if (done) return; done = !keepOpen; const v = shown[i].value; if (keepOpen){ input.value = ""; typed = false; active = -1; if (collapsed) opened = false; render(); } onPick(v); }
  function pickFree(){ if (done) return; const v = input.value.trim(); done = !keepOpen; onPick(v === "" ? null : v); if (keepOpen){ input.value = ""; typed = false; render(); input.focus(); } }
  function cancel(){ if (done) return; done = true; onCancel && onCancel(); }
  function reject(){ wrap.classList.add("invalid"); hint.classList.add("err"); hint.textContent = "Not one of the options. Pick one from the list."; }
  function commitTyped(){
    const q = norm(input.value);
    if (!typed) return keepOpen ? null : cancel();
    const exactI = shown.findIndex(o => norm(o.label) === q || norm(o.value ?? "") === q);
    if (exactI >= 0) return pickIndex(exactI);
    if (free) return pickFree();
    if (shown.length === 1) return pickIndex(0);
    reject();
  }
  const collapse = () => { input.value = ""; typed = false; active = -1; opened = false; render(); };
  input.addEventListener("input", () => { typed = true; opened = true; active = norm(input.value) ? 0 : -1; render(); });
  input.addEventListener("keydown", e => {
    const total = shown.length + freeRowCount();
    if (e.key === "ArrowDown"){ e.preventDefault(); if (!opened){ opened = true; active = 0; render(); return; } active = Math.min(total - 1, active + 1); render(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); active = Math.max(0, active - 1); render(); }
    else if (e.key === "Enter"){ e.preventDefault();
      const sel = list.querySelector('[aria-selected="true"]');
      if (sel && sel.dataset.free) pickFree(); else if (sel && sel.dataset.i !== undefined) pickIndex(+sel.dataset.i); else commitTyped(); }
    else if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation();
      if (keepOpen){ if (collapsed && opened) collapse(); else onCancel && onCancel(); } else cancel(); }
    else if (e.key === "Tab" && !keepOpen){ if (typed) commitTyped(); else cancel(); }
  });
  list.addEventListener("mousedown", e => {
    const li = e.target.closest("li"); if (!li || li.classList.contains("nomatch")) return;
    e.preventDefault();
    if (li.dataset.free) pickFree(); else pickIndex(+li.dataset.i);
  });
  input.addEventListener("blur", () => setTimeout(() => {
    if (done || host.contains(document.activeElement)) return;
    if (keepOpen){ if (collapsed) collapse(); return; }
    if (!typed) return cancel();
    const q = norm(input.value);
    if (free) return pickFree();
    const exactI = shown.findIndex(o => norm(o.label) === q);
    if (exactI >= 0) pickIndex(exactI); else cancel();
  }, 120));
  render();
  if (autofocus){ input.focus(); input.select(); }
  return {input};
}

let saving = false;
async function save(g, changes){
  if (saving) return;
  saving = true;
  try {
    const updated = await api(`/api/garments/${g.id}`, {method: "PATCH", body: changes});
    const i = G.findIndex(x => x.id === g.id);
    G[i] = updated;
    O.forEach(o => o.garments.forEach(x => { if (x.garment.id === g.id) x.garment = updated; }));
    reindex();
    toast("Saved");
  } catch (e) {
    toast(e.message, true);
  } finally {
    saving = false;
    refresh();
  }
}
const colorOptions = () => OPT.colors.map(c => ({value: c.name, label: c.name, hex: c.hex}));
const NONE = {value: null, label: "— none"};

function openEditor(field){
  const g = currentGarment(); if (!g) return;
  const host = document.querySelector(`[data-field="${field}"]`); if (!host) return;
  const f = FIELDS.find(x => x.key === field);
  const cancel = () => refresh();
  const setOne = v => { if (v === g[field]) return refresh(); save(g, {[field]: v}); };

  if (field === "category"){
    combo(host, {options: OPT.categories.map(c => ({value: c, label: c})), current: g.category, onCancel: cancel,
      onPick: v => {
        if (v === g.category) return refresh();
        const sub = document.querySelector('[data-field="subcategory"]');
        host.innerHTML = `<span class="cchip">${esc(v)}</span><div class="hintline">Now pick a ${esc(v)} subcategory to save</div>`;
        subcategoryEditor(sub, g, v);
      }});
  } else if (field === "subcategory"){
    subcategoryEditor(host, g, g.category);
  } else if (f && f.kind === "color"){
    combo(host, {options: colorOptions(), current: g[field], onCancel: cancel, onPick: setOne});
  } else if (f && f.kind === "colors"){
    multiEditor(host, g, field, colorOptions(), false);
  } else if (f && (f.kind === "level" || f.kind === "choice")){
    const opts = f.list().map(l => ({value: l.value, label: f.kind === "level" ? `${l.value} · ${l.label}` : l.label}));
    combo(host, {options: [...opts, NONE], current: g[field], onCancel: cancel, onPick: setOne});
  } else if (f && f.kind === "text"){
    combo(host, {options: f.suggest().map(v => ({value: v, label: v})), current: g[field], free: true, placeholder: "Type a value…", onCancel: cancel, onPick: setOne});
  } else if (field === "materials"){
    materialsEditor(host, g);
  } else if (field === "style_tags"){
    multiEditor(host, g, field, unique(G.flatMap(x => x.style_tags)).map(t => ({value: t, label: t})), true);
  } else if (field === "notes" || field === "label_text"){
    textEditor(host, g, field);
  }
}
function subcategoryEditor(host, g, category){
  const opts = (OPT.subcategories[category] || []).map(s => ({value: s, label: s}));
  combo(host, {options: opts, current: category === g.category ? g.subcategory : null, placeholder: `Type to filter ${category} subcategories…`,
    onCancel: () => refresh(),
    onPick: v => {
      if (category === g.category && v === g.subcategory) return refresh();
      save(g, category === g.category ? {subcategory: v} : {category, subcategory: v});
    }});
}
function multiEditor(host, g, field, options, free){
  const values = g[field].slice();
  const isColor = field !== "style_tags";
  host.innerHTML = `<div class="multi"><div class="have">${values.map((v, i) => `<span class="pill">${isColor ? `<span class="chip" style="background:${hex(v)}"></span>` : ""}${esc(v)}<button type="button" data-rm="${i}" aria-label="Remove ${esc(v)}">×</button></span>`).join("") || `<span class="empty">None yet</span>`}</div>
    <div class="btns"><button type="button" class="btn done-btn">Done</button><span class="hintline">Changes save as you go</span></div>
    <div class="adder"></div></div>`;
  host.querySelector(".have").addEventListener("click", e => {
    const b = e.target.closest("[data-rm]"); if (!b) return;
    const next = values.filter((_, i) => i !== +b.dataset.rm);
    save(g, {[field]: next}).then(() => openEditor(field));
  });
  host.querySelector(".done-btn").addEventListener("click", () => refresh());
  combo(host.querySelector(".adder"), {options: options.filter(o => !values.includes(o.value)), free, keepOpen: true, onCancel: () => refresh(),
    placeholder: isColor ? "Add a color…" : "Add a tag…",
    onPick: v => { if (v === null || values.includes(v)) return; save(g, {[field]: [...values, v]}).then(() => openEditor(field)); }});
  host.addEventListener("keydown", e => { if (e.key === "Escape") refresh(); });
}
function textEditor(host, g, field){
  host.innerHTML = `<textarea class="txt" rows="${field === "label_text" ? 5 : 3}" spellcheck="${field === "notes"}">${esc(g[field] || "")}</textarea>
    <div class="btns" style="margin-top:8px"><button type="button" class="btn primary" data-act="save">Save</button><button type="button" class="btn quiet" data-act="cancel">Cancel</button><span class="hintline">Ctrl+Enter to save · Esc to cancel</span></div>`;
  const ta = host.querySelector("textarea");
  const commit = () => { const v = ta.value.trim() || null; if (v === (g[field] || null)) return refresh(); save(g, {[field]: v}); };
  host.querySelector('[data-act="save"]').onclick = commit;
  host.querySelector('[data-act="cancel"]').onclick = () => refresh();
  ta.addEventListener("keydown", e => {
    if (e.key === "Escape"){ e.preventDefault(); refresh(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); commit(); }
  });
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function materialsEditor(host, g){
  let parts = JSON.parse(JSON.stringify(g.materials));
  const fibers = unique(G.flatMap(x => x.materials.flatMap(m => m.fibers.map(f => f.fiber))));
  const partNames = unique(G.flatMap(x => x.materials.map(m => m.part)));
  const listId = "fibers-" + g.id, partId = "parts-" + g.id;
  function draw(){
    host.innerHTML = `<div class="mats">
      <datalist id="${listId}">${fibers.map(f => `<option value="${esc(f)}">`).join("")}</datalist>
      <datalist id="${partId}">${partNames.map(f => `<option value="${esc(f)}">`).join("")}</datalist>
      ${parts.map((m, pi) => { const sum = m.fibers.reduce((n, f) => n + (+f.percent || 0), 0); return `<div class="mpart">
        <div class="top"><input class="txt" list="${partId}" data-p="${pi}" data-k="part" value="${esc(m.part || "")}" placeholder="Part (optional, e.g. shell, lining)" aria-label="Part name">
          ${parts.length > 1 ? `<button type="button" class="x" data-rmpart="${pi}" aria-label="Remove this part">×</button>` : ""}</div>
        ${m.fibers.map((f, fi) => `<div class="frow"><input class="txt" list="${listId}" data-p="${pi}" data-f="${fi}" data-k="fiber" value="${esc(f.fiber)}" placeholder="Fiber" aria-label="Fiber">
          <span class="pct"><input class="num" type="number" min="1" max="100" step="1" data-p="${pi}" data-f="${fi}" data-k="percent" value="${f.percent}" aria-label="Percent"></span>
          <button type="button" class="x" data-rmfiber="${pi}:${fi}" aria-label="Remove this fiber">×</button></div>`).join("")}
        <div class="btns"><button type="button" class="btn quiet" data-addfiber="${pi}">+ Fiber</button><span class="msum${sum === 100 ? "" : " off"}">total ${sum}%</span></div>
      </div>`; }).join("")}
      <div class="btns"><button type="button" class="btn quiet" data-addpart>+ Part</button></div>
      <div class="btns"><button type="button" class="btn primary" data-act="save">Save materials</button><button type="button" class="btn quiet" data-act="cancel">Cancel</button><span class="hintline" id="materr"></span></div>
    </div>`;
  }
  draw();
  host.addEventListener("input", e => {
    const el = e.target; if (!el.dataset.k) return;
    const m = parts[+el.dataset.p];
    if (el.dataset.k === "part") m.part = el.value;
    else if (el.dataset.k === "fiber") m.fibers[+el.dataset.f].fiber = el.value;
    else if (el.dataset.k === "percent"){ m.fibers[+el.dataset.f].percent = el.value === "" ? "" : +el.value;
      const sum = m.fibers.reduce((n, f) => n + (+f.percent || 0), 0);
      const s = el.closest(".mpart").querySelector(".msum"); s.textContent = `total ${sum}%`; s.classList.toggle("off", sum !== 100); }
  });
  host.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.addfiber !== undefined){ parts[+t.dataset.addfiber].fibers.push({fiber: "", percent: ""}); draw(); focusLast(+t.dataset.addfiber); }
    else if (t.dataset.rmfiber){ const [p, f] = t.dataset.rmfiber.split(":").map(Number); parts[p].fibers.splice(f, 1); draw(); }
    else if (t.dataset.rmpart !== undefined){ parts.splice(+t.dataset.rmpart, 1); draw(); }
    else if (t.dataset.addpart !== undefined){ parts.push({part: "", fibers: [{fiber: "", percent: ""}]}); draw(); focusLast(parts.length - 1); }
    else if (t.dataset.act === "cancel") refresh();
    else if (t.dataset.act === "save"){
      const err = host.querySelector("#materr");
      const clean = parts.map(m => ({part: (m.part || "").trim() || null, fibers: m.fibers.filter(f => String(f.fiber).trim() || f.percent !== "")
        .map(f => ({fiber: String(f.fiber).trim(), percent: f.percent === "" ? NaN : Number(f.percent)}))})).filter(m => m.fibers.length);
      const bad = clean.flatMap(m => m.fibers).find(f => !f.fiber || !Number.isInteger(f.percent) || f.percent < 1 || f.percent > 100);
      if (bad){ err.textContent = "Each fiber needs a name and a whole-number percent from 1 to 100."; err.classList.add("err"); return; }
      save(g, {materials: clean});
    }
  });
  host.addEventListener("keydown", e => { if (e.key === "Escape") refresh(); });
  function focusLast(pi){ const els = host.querySelectorAll(`[data-p="${pi}"][data-k="fiber"]`); (els[els.length - 1] || host.querySelector(`[data-p="${pi}"]`))?.focus(); }
  host.querySelector("input")?.focus();
}

let builderBusy = false, restoringTree = false;
const saveBuilder = () => store.set("enclothed-builder", {open: builder.open, min: builder.min, pieces: builder.pieces, details: builder.details,
  manual: builder.manual, form: builder.form, session: builder.session});
const sortedPieces = () => builder.pieces.map(id => byId[id]).filter(Boolean).sort((a, b) => catRank(a) - catRank(b) || a.id - b.id);
const sameSet = (a, b) => a.length === b.length && [...a].sort().join() === [...b].sort().join();
const unchangedSinceLast = () => builder.session && sameSet(builder.pieces, builder.session.last.pieces) && builder.details.trim() === builder.session.last.details.trim();

function pickButton(g){
  const on = builder.pieces.includes(g.id);
  return `<button type="button" class="addbtn" data-pick="${g.id}" aria-pressed="${on}" aria-label="${on ? "Remove from outfit" : "Add to outfit"}: ${esc(title(g))}" title="${on ? "Remove from outfit" : "Add to outfit"}">${on ? "−" : "+"}</button>`;
}
function togglePiece(id){
  id = +id;
  if (builder.pieces.includes(id)) builder.pieces = builder.pieces.filter(x => x !== id);
  else { builder.pieces = [...builder.pieces, id]; if (!builder.open){ builder.open = true; builder.min = isPhone(); } }
  saveBuilder(); renderBuilder(); refresh();
}
const isPhone = () => matchMedia("(max-width:900px)").matches;
function openBuilder(){ builder.open = true; builder.min = false; saveBuilder(); renderBuilder(); refresh(); }
function closeBuilder(){ builder.open = false; saveBuilder(); renderBuilder(); refresh(); }
function newOutfit(){
  Object.assign(builder, {open: true, min: false, pieces: [], details: "", manual: false, form: {aesthetic: "", explanation: "", missing: "", advice: {}}, session: null});
  saveBuilder(); renderBuilder();
  if (location.hash !== "#wardrobe") location.hash = "#wardrobe"; else refresh();
}
function scrollToCategory(c){
  const goScroll = () => document.getElementById("rail-" + c)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  if (cat !== "all" && cat !== c) cat = "all";
  scope = "any";
  if (current !== "wardrobe"){ location.hash = "#wardrobe"; setTimeout(goScroll, 60); }
  else { refresh(); goScroll(); }
}

function renderBuilder(){
  let el = document.getElementById("builder");
  if (!el){ el = document.createElement("aside"); el.id = "builder"; el.className = "builder"; el.setAttribute("aria-label", "Outfit builder"); document.body.appendChild(el); }
  document.body.classList.toggle("with-builder", builder.open);
  document.body.classList.toggle("builder-min", builder.open && builder.min);
  el.hidden = !builder.open;
  el.classList.toggle("min", builder.min);
  if (!builder.open) return;
  const keepScroll = el.querySelector(".bbody")?.scrollTop || 0;
  const openTrees = [...el.querySelectorAll("details[data-tree][open]")].map(d => d.dataset.tree);
  const pieces = sortedPieces();
  const hasDetails = builder.details.trim().length > 0;
  const retry = !!builder.session;
  let suggestBlock = "";
  let reason = "";
  if (!pieces.length && !hasDetails) reason = "Pick at least one piece or describe the occasion.";
  else if (retry && unchangedSinceLast()) reason = "Change the pieces or details to get new suggestions.";
  const cats = RAIL_ORDER.filter(c => G.some(g => g.category === c));
  const tree = cats.map(c => { const items = G.filter(g => g.category === c); return `<details data-tree="${esc(c)}"><summary><span>${esc(c)}</span><em>${items.length}</em></summary><ul>${items.map(g => {
      const on = builder.pieces.includes(g.id);
      return `<li><span class="chip" style="background:${hex(g.primary_color)}"></span><span>${esc(title(g))}</span><button type="button" class="small-add" data-pick="${g.id}" aria-pressed="${on}" aria-label="${on ? "Remove" : "Add"} ${esc(title(g))}">${on ? "−" : "+"}</button></li>`; }).join("")}</ul></details>`; }).join("");
  const pieceRows = pieces.length ? pieces.map(g => `<div class="bpiece">
      <div class="ph">${ph(g, thumb(g))}<button type="button" class="rm" data-pick="${g.id}" aria-label="Remove ${esc(title(g))} from outfit">×</button></div>
      <div><span class="eyebrow">${esc(g.category)}</span><br><a class="nm" href="#garment-${g.id}">${esc(title(g))}</a>
        ${builder.manual ? `<input class="txt" data-advice="${g.id}" value="${esc(builder.form.advice[g.id] || "")}" placeholder="How to wear it (optional)" aria-label="How to wear ${esc(title(g))}">` : ""}</div>
    </div>`).join("") : `<p class="bhint">No pieces yet. Use the + on any garment, the list below, or type a name.</p>`;

  const manualForm = `<div class="bsec">
      <div class="field"><label for="b-aes">Name <span class="req-star" aria-hidden="true">*</span></label><input id="b-aes" class="txt" data-form="aesthetic" value="${esc(builder.form.aesthetic)}" placeholder="e.g. Sunday errands" required></div>
      <div class="field"><label for="b-exp">Why it works <span class="req-star" aria-hidden="true">*</span></label><textarea id="b-exp" class="txt" rows="3" data-form="explanation" placeholder="A sentence or two for future you" required>${esc(builder.form.explanation)}</textarea></div>
      <div class="field"><label for="b-mis">Still missing <em>(optional)</em></label><input id="b-mis" class="txt" data-form="missing" value="${esc(builder.form.missing)}" placeholder="e.g. a darker belt"></div>
    </div>`;
  const busy = builderBusy ? `<div class="busy" role="status"><span class="spin" aria-hidden="true"></span>${builder.manual ? "Saving…" : "Asking for outfit suggestions… this can take up to a minute."}</div>` : "";
  const manualReason = !pieces.length ? "Add at least one piece." : (!builder.form.aesthetic.trim() || !builder.form.explanation.trim()) ? "Fill in the name and why it works." : "";
  const foot = builder.manual
    ? `${busy}<button type="button" class="btn primary wide" data-save-own ${manualReason || builderBusy ? "disabled" : ""}>Save outfit</button>
       <p class="bhint" id="b-reason">${esc(manualReason)}</p>
       <button type="button" class="btn quiet wide" data-manual="off" ${builderBusy ? "disabled" : ""}>Back to suggestions</button>`
    : `${busy}<button type="button" class="btn primary wide" data-suggest ${reason || builderBusy ? "disabled" : ""}>${retry ? "Suggest again" : "Generate outfit suggestions"}</button>
       <p class="bhint" id="b-reason">${esc(reason)}</p>
       <button type="button" class="btn quiet wide" data-manual="on" ${builderBusy ? "disabled" : ""}>Save as my own outfit instead</button>`;

  el.innerHTML = `<div class="bhead"><h2>${retry ? "Refine outfit" : "New outfit"}</h2><small>${plural(pieces.length, "piece")}</small>
      <button type="button" class="iconbtn" data-builder-min aria-label="${builder.min ? "Expand" : "Minimize"} outfit builder" aria-expanded="${!builder.min}">${builder.min ? "▴" : "▾"}</button>
      <button type="button" class="iconbtn" data-builder-close aria-label="Close outfit builder">×</button></div>
    <div class="bbody">
      <div class="bsec"><h3>${builder.manual ? "Pieces" : "Pieces to build around"}</h3><div class="bpieces">${pieceRows}</div></div>
      <div class="bsec"><h3>Add pieces</h3><div id="b-search"></div><div class="tree">${tree}</div></div>
      <div class="bsec"><div class="field"><label for="b-details">${builder.manual ? "Occasion" : "Occasion and details"} <em>(optional${pieces.length || builder.manual ? "" : " if you pick pieces"})</em></label>
        <textarea id="b-details" class="txt" rows="3" data-details placeholder="${builder.manual ? "e.g. rainy Sunday" : "e.g. dinner downtown, about 10°C, want to wear the new boots"}">${esc(builder.details)}</textarea></div></div>
      ${builder.manual ? manualForm : ""}
    </div>
    <div class="bfoot">${foot}</div>`;

  restoringTree = true;
  openTrees.forEach(c => { const d = el.querySelector(`details[data-tree="${CSS.escape(c)}"]`); if (d) d.open = true; });
  setTimeout(() => { restoringTree = false; }, 60);
  el.querySelector(".bbody").scrollTop = keepScroll;
  const options = G.filter(g => !builder.pieces.includes(g.id)).sort((a, b) => catRank(a) - catRank(b))
    .map(g => ({value: g.id, label: `${title(g)} · ${g.primary_color} · #${g.id}`, hex: hex(g.primary_color)}));
  combo(el.querySelector("#b-search"), {options, keepOpen: true, autofocus: false, collapsed: true, placeholder: "Type a garment name to add it…", onPick: id => { togglePiece(id); document.querySelector("#b-search input")?.focus(); }});
}
function updateBuilderButtons(){
  const el = document.getElementById("builder"); if (!el) return;
  const pieces = sortedPieces();
  const reasonEl = el.querySelector("#b-reason");
  if (builder.manual){
    const reason = !pieces.length ? "Add at least one piece." : (!builder.form.aesthetic.trim() || !builder.form.explanation.trim()) ? "Fill in the name and why it works." : "";
    el.querySelector("[data-save-own]").disabled = !!reason || builderBusy; reasonEl.textContent = reason;
  } else {
    let reason = "";
    if (!pieces.length && !builder.details.trim()) reason = "Pick at least one piece or describe the occasion.";
    else if (builder.session && unchangedSinceLast()) reason = "Change the pieces or details to get new suggestions.";
    el.querySelector("[data-suggest]").disabled = !!reason || builderBusy; reasonEl.textContent = reason;
  }
}
document.addEventListener("input", e => {
  if (!e.target.closest("#builder")) return;
  const t = e.target;
  if (t.hasAttribute("data-details")) builder.details = t.value;
  else if (t.dataset.form) builder.form[t.dataset.form] = t.value;
  else if (t.dataset.advice) builder.form.advice[t.dataset.advice] = t.value;
  else return;
  saveBuilder(); updateBuilderButtons();
});
document.addEventListener("toggle", e => {
  const d = e.target;
  if (!restoringTree && d.matches && d.matches("#builder details[data-tree]") && d.open) scrollToCategory(d.dataset.tree);
}, true);

async function suggest(){
  if (builderBusy) return;
  const fresh = !builder.session;
  const sent = {pieces: builder.pieces.slice(), details: builder.details};
  builderBusy = true; renderBuilder();
  try {
    const created = (await api("/api/outfits/suggestions", {method: "POST", body: {anchors: sent.pieces, details: sent.details}})).map(adoptOutfit);
    if (!created.length) throw new Error("No complete outfits came back this time. Try again, or adjust the pieces or details.");
    O.push(...created); reindex();
    const ids = created.map(o => o.id);
    builder.session = fresh ? {ids, last: sent} : {ids: [...builder.session.ids, ...ids], last: sent};
    builder.open = false;
    saveBuilder();
    toast(`${plural(created.length, "new outfit")}`);
    builderBusy = false; renderBuilder();
    if (location.hash === "#results") refresh(); else location.hash = "#results";
    return;
  } catch (e) { toast(e.message, true); }
  builderBusy = false; renderBuilder();
}
async function saveOwn(){
  if (builderBusy) return;
  builderBusy = true; renderBuilder();
  try {
    const body = {aesthetic: builder.form.aesthetic, explanation: builder.form.explanation, missing: builder.form.missing || null, details: builder.details || null,
      garments: sortedPieces().map(g => ({garment_id: g.id, styling_advice: builder.form.advice[g.id] || null}))};
    const created = adoptOutfit(await api("/api/outfits", {method: "POST", body}));
    O.push(created); reindex();
    Object.assign(builder, {open: false, pieces: [], details: "", manual: false, form: {aesthetic: "", explanation: "", missing: "", advice: {}}, session: null});
    saveBuilder(); builderBusy = false; renderBuilder();
    toast("Outfit saved");
    location.hash = "#outfit-" + created.id;
    return;
  } catch (e) { toast(e.message, true); }
  builderBusy = false; renderBuilder();
}
function handleBuilderClick(e){
  const t = e.target.closest("[data-pick],[data-new-outfit],[data-builder-open],[data-results-retry],[data-results-done],[data-add-garment]");
  if (!t) return false;
  if (t.dataset.pick){ e.preventDefault(); togglePiece(t.dataset.pick); }
  else if (t.hasAttribute("data-new-outfit")) newOutfit();
  else if (t.hasAttribute("data-builder-open")) openBuilder();
  else if (t.hasAttribute("data-add-garment")) openUpload();
  else if (t.hasAttribute("data-results-retry")){ builder.open = true; builder.min = false; builder.manual = false; saveBuilder(); renderBuilder(); location.hash = "#wardrobe"; }
  else if (t.hasAttribute("data-results-done")){
    Object.assign(builder, {open: false, pieces: [], details: "", manual: false, session: null}); saveBuilder(); renderBuilder(); location.hash = "#outfits"; }
  return true;
}
document.addEventListener("click", e => {
  if (!e.target.closest("#builder")) return;
  if (handleBuilderClick(e)) return;
  const t = e.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-builder-close")) closeBuilder();
  else if (t.hasAttribute("data-builder-min")){ builder.min = !builder.min; saveBuilder(); renderBuilder(); }
  else if (t.hasAttribute("data-suggest")) suggest();
  else if (t.hasAttribute("data-save-own")) saveOwn();
  else if (t.dataset.manual){ builder.manual = t.dataset.manual === "on"; saveBuilder(); renderBuilder(); }
});

/* ================= results ================= */
function resultsPage(){
  const s = builder.session;
  if (!s || !s.ids.length) return `<div class="state"><h1>No new suggestions</h1><p>Start one from <a href="#outfits">Outfits</a> with “New outfit”.</p></div>`;
  const list = s.ids.map(id => outById[id]).filter(Boolean).reverse();
  const requests = [...new Set(list.map(o => o.prompt_message))];
  const anchors = s.last.pieces.map(id => byId[id]).filter(Boolean);
  return `<header class="hero"><div><h1>New suggestions</h1>
      <p class="sub">${plural(list.length, "outfit")} for ${requests.map(r => `<q>${esc(r)}</q>`).join(", ")}${anchors.length ? `, built around ${anchors.map(g => esc(title(g))).join(", ")}` : ""}. Newest first; open one to like or dislike it.</p>
      <div class="hero-actions results-actions"><button type="button" class="btn primary" data-results-retry>Change pieces or details and try again</button><button type="button" class="btn" data-results-done>Done</button></div></div></header>
    <main><div class="ogrid">${list.map(oCard).join("")}</div></main>`;
}

/* ================= add a garment ================= */
let upload = {files: [], busy: false};
function openUpload(){
  upload = {files: [], busy: false, prompt: "", notes: ""};
  let ov = document.getElementById("upload");
  if (!ov){ ov = document.createElement("div"); ov.id = "upload"; ov.className = "overlay"; document.body.appendChild(ov);
    ov.addEventListener("click", uploadClick); ov.addEventListener("change", uploadChange); ov.addEventListener("input", e => {
      if (e.target.id === "u-prompt") upload.prompt = e.target.value; if (e.target.id === "u-notes") upload.notes = e.target.value; });
    ov.addEventListener("keydown", e => { if (e.key === "Escape" && !upload.busy) closeUpload(); }); }
  ov.hidden = false; document.body.style.overflow = "hidden";
  renderUpload();
  ov.querySelector("[data-u-close]").focus();
}
function closeUpload(){
  upload.files.forEach(f => URL.revokeObjectURL(f.url));
  const ov = document.getElementById("upload"); ov.hidden = true; ov.innerHTML = ""; document.body.style.overflow = "";
}
function renderUpload(){
  const ov = document.getElementById("upload");
  const n = upload.files.length;
  ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="u-title">
    <div class="bhead"><h2 id="u-title">Add a garment</h2><button type="button" class="iconbtn" data-u-close aria-label="Close" ${upload.busy ? "disabled" : ""}>×</button></div>
    <div class="bbody">
      <ul class="tips"><li><b>Front</b> and <b>back</b> of the whole garment, on a hanger or laid flat</li><li>Every <b>label</b>: brand, size, and the care tag with the fabric content</li><li>Close-ups of any details worth noting (optional). Up to ${OPT_UPLOAD_MAX} photos.</li></ul>
      <div class="pickers">
        <label class="btn primary">Take a photo<input type="file" accept="image/*" capture="environment" data-u-input ${upload.busy ? "disabled" : ""}></label>
        <label class="btn">Choose photos<input type="file" accept="image/*" multiple data-u-input ${upload.busy ? "disabled" : ""}></label>
      </div>
      ${n ? `<div class="previews">${upload.files.map((f, i) => `<div class="ph"><img src="${f.url}" alt="Photo ${i + 1}" data-u-img="${i}"><button type="button" class="rm" data-u-rm="${i}" aria-label="Remove photo ${i + 1}" ${upload.busy ? "disabled" : ""}>×</button></div>`).join("")}</div>`
        : `<p class="bhint">No photos yet. On a phone, “Take a photo” opens the camera; take one at a time and repeat.</p>`}
      <div class="field"><label for="u-prompt">Anything the photos don't show <em>(optional, helps the tagging)</em></label>
        <textarea id="u-prompt" class="txt" rows="2" placeholder="e.g. the true color is navy, not black; vintage 1990s; runs small" ${upload.busy ? "disabled" : ""}>${esc(upload.prompt)}</textarea></div>
      <div class="field"><label for="u-notes">Your notes <em>(optional, kept private, never sent to the AI)</em></label>
        <textarea id="u-notes" class="txt" rows="2" placeholder="e.g. bought at 2nd Street Taipei; hemmed 2 cm" ${upload.busy ? "disabled" : ""}>${esc(upload.notes)}</textarea></div>
      <p class="formerr" id="u-err" role="alert"></p>
    </div>
    <div class="bfoot">${upload.busy ? `<div class="busy" role="status"><span class="spin" aria-hidden="true"></span>Tagging your garment… this can take up to a minute.</div>` : ""}
      <button type="button" class="btn primary wide" data-u-submit ${!n || upload.busy ? "disabled" : ""}>${n ? `Tag and add (${plural(n, "photo")})` : "Add at least one photo"}</button></div>
  </div>`;
  ov.querySelectorAll("[data-u-img]").forEach(img => { img.onerror = () => {
    const name = document.createElement("span"); name.className = "fname"; name.textContent = upload.files[+img.dataset.uImg]?.file.name || "photo"; img.replaceWith(name); }; });
}
const OPT_UPLOAD_MAX = 10;
function uploadChange(e){
  const input = e.target.closest("[data-u-input]"); if (!input) return;
  const room = OPT_UPLOAD_MAX - upload.files.length;
  const picked = [...input.files].slice(0, room);
  if (input.files.length > room) toast(`Only ${OPT_UPLOAD_MAX} photos per garment; the rest were skipped.`, true);
  upload.files.push(...picked.map(file => ({file, url: URL.createObjectURL(file)})));
  renderUpload();
}
async function uploadClick(e){
  if (e.target.id === "upload" && !upload.busy) return closeUpload();
  const t = e.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-u-close")) closeUpload();
  else if (t.dataset.uRm){ const [gone] = upload.files.splice(+t.dataset.uRm, 1); URL.revokeObjectURL(gone.url); renderUpload(); }
  else if (t.hasAttribute("data-u-submit")){
    upload.busy = true; renderUpload();
    const form = new FormData();
    upload.files.forEach(f => form.append("photos", f.file, f.file.name || "photo.jpg"));
    if (upload.prompt.trim()) form.append("prompt_message", upload.prompt);
    if (upload.notes.trim()) form.append("notes", upload.notes);
    try {
      let res;
      try { res = await fetch("/api/garments", {method: "POST", body: form}); }
      catch (err) { throw new Error("Couldn't reach the server. Is it still running?"); }
      let data = null; try { data = await res.json(); } catch (err) {}
      if (!res.ok) throw new Error(errorText(data, res.status));
      G.push(data); reindex();
      closeUpload();
      toast("Added. Check the tags and fix anything that's off.");
      location.hash = "#garment-" + data.id;
    } catch (err) {
      upload.busy = false; renderUpload();
      const box = document.getElementById("u-err"); if (box) box.textContent = err.message;
    }
  }
}

/* ================= routing ================= */
const app = document.getElementById("app");
const scrollMem = {};
let current = null;
const stack = [location.hash || "#wardrobe"];
function currentGarment(){ const m = location.hash.match(/^#garment-(\d+)$/); return m ? byId[m[1]] : null; }
function render(){
  const h = location.hash.slice(1);
  let m, view = "wardrobe", html;
  if ((m = h.match(/^garment-(\d+)$/))){
    const g = byId[m[1]];
    view = "garment";
    html = g ? garmentPage(g) : `<div class="state"><h1>Garment not found</h1><p><a href="#wardrobe">Back to the wardrobe</a></p></div>`;
    document.title = g ? `${title(g)} · enclothed` : "enclothed";
  } else if ((m = h.match(/^outfit-(\d+)$/))){
    const o = outById[m[1]];
    view = "outfit";
    html = o ? outfitPage(o) : `<div class="state"><h1>Outfit not found</h1><p><a href="#outfits">Back to outfits</a></p></div>`;
    document.title = o ? `${o.aesthetic} · enclothed` : "enclothed";
  } else if (h === "outfits"){ view = "outfits"; html = outfits(); document.title = "Outfits · enclothed"; }
  else if (h === "results"){ view = "results"; html = resultsPage(); document.title = "New suggestions · enclothed"; }
  else { html = wardrobe(); document.title = "enclothed"; }
  app.innerHTML = html;
  const section = (view === "outfit" || view === "outfits" || view === "results") ? "outfits" : "wardrobe";
  for (const k of ["wardrobe", "outfits"]){ const n = document.getElementById("nav-" + k);
    if (k === section) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current"); }
  const prev = stack.length > 1 ? stack[stack.length - 2] : null;
  const bk = app.querySelector("[data-back]");
  if (bk && prev){ const pm = prev.match(/^#(garment|outfit)-/);
    bk.textContent = pm ? `← Back to ${pm[1]}` : prev === "#results" ? "← New suggestions" : prev === "#outfits" ? "← Outfits" : "← Wardrobe"; }
  return view;
}
function route(){
  if (current === "wardrobe" || current === "outfits") scrollMem[current] = scrollY;
  const view = render();
  current = view;
  if (view === "garment") wireGallery();
  scrollTo(0, (view === "wardrobe" || view === "outfits") ? (scrollMem[view] || 0) : 0);
}
/* Re-draw the current page after a change, keeping scroll and photo position. */
function refresh(){
  const y = scrollY, gi = galleryIndex();
  const view = render();
  if (view === "garment") wireGallery(gi);
  scrollTo(0, y);
}
addEventListener("hashchange", () => {
  const h = location.hash || "#wardrobe";
  if (stack.length > 1 && stack[stack.length - 2] === h) stack.pop(); else if (stack[stack.length - 1] !== h) stack.push(h);
  route();
});
app.addEventListener("click", e => {
  const f = e.target.closest("[data-cat],[data-scope],[data-req],[data-toggle-disliked]");
  if (f){
    if (f.dataset.cat) cat = f.dataset.cat;
    if (f.dataset.scope) scope = f.dataset.scope;
    if (f.dataset.req) req = f.dataset.req;
    if (f.hasAttribute("data-toggle-disliked")){ showDisliked = !showDisliked; store.set("enclothed-show-disliked", showDisliked); }
    refresh(); return;
  }
  const of = e.target.closest("[data-ofilt-f],[data-ofilt-w],[data-ofilt-clear]");
  if (of){
    const toggle = (list, v) => list.includes(v) ? list.filter(x => x !== v) : [...list, v];
    if (of.dataset.ofiltF) ofilt.formality = toggle(ofilt.formality, +of.dataset.ofiltF);
    else if (of.dataset.ofiltW) ofilt.warmth = toggle(ofilt.warmth, +of.dataset.ofiltW);
    else ofilt = {q: "", from: "", to: "", formality: [], warmth: []};
    refresh(); return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed){ openEditor(ed.dataset.edit); return; }
  if (handleBuilderClick(e)) return;
  const r = e.target.closest("[data-rate]");
  if (r){ const id = r.dataset.rateId || (location.hash.match(/^#outfit-(\d+)$/) || [])[1]; if (id && outById[id]) rate(outById[id], r.dataset.rate === "true"); return; }
  const b = e.target.closest("[data-back]");
  if (b){ if (stack.length > 1) history.back(); else location.hash = b.dataset.back; }
});
/* Typing in a filter redraws the page, so put the cursor back where it was. */
let filterTimer = null;
app.addEventListener("input", e => {
  const el = e.target.closest("[data-ofilt]"); if (!el) return;
  ofilt[el.dataset.ofilt] = el.value;
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => {
    const id = el.id, start = el.selectionStart, end = el.selectionEnd;
    refresh();
    const again = document.getElementById(id);
    if (again){ again.focus(); try { again.setSelectionRange(start, end); } catch (err) {} }
  }, el.type === "date" ? 0 : 200);
});
addEventListener("keydown", e => {
  if (!galleryGo || e.target.closest("input,textarea,[role=combobox]")) return;
  if (e.key === "ArrowRight"){ e.preventDefault(); galleryGo(1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); galleryGo(-1); }
});

/* ================= Day / Evening ================= */
function paintTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  document.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
}
document.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", b.dataset.t);
  try { localStorage.setItem("enclothed-theme", b.dataset.t); } catch (e) {}
  paintTheme();
}));
paintTheme();

/* ================= start ================= */
(async function start(){
  try {
    const [garments, outfitList, sets, options, profile] = await Promise.all([
      api("/api/garments"), api("/api/outfits"), api("/api/sets"), api("/api/options"), api("/api/profile")]);
    G = garments; O = outfitList.map(adoptOutfit); SETS = sets; OPT = options;
    HEX = Object.fromEntries(options.colors.map(c => [c.name, c.hex]));
    document.getElementById("who").textContent = profile.name;
    reindex();
    builder.pieces = builder.pieces.filter(id => byId[id]);
    if (builder.session) builder.session.ids = builder.session.ids.filter(id => outById[id]);
    renderBuilder();
    route();
  } catch (e) {
    app.innerHTML = `<div class="state"><h1>Couldn't load your wardrobe</h1><p>${esc(e.message)}</p><p>Check that the server is running (<code>uv run fastapi dev src/enclothed/api.py</code>), then refresh.</p></div>`;
  }
})();
</script>
