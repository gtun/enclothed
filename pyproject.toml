[project]
name = "wardrobe-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gtun", email = "garytunak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
wardrobe-ai = "wardrobe_ai.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
