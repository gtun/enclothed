[project]
name = "enclothed"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gtun", email = "garytunak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
enclothed = "enclothed.main:main"
backup = "enclothed.maintenance:backup"
restore = "enclothed.maintenance:restore"
refresh = "enclothed.maintenance:refresh"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
