name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Import check
        run: uv run python -c "import enclothed.main"
      - name: Run tests
        run: uv run pytest
